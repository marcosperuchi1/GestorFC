name: FutBR Windows 18.369 - restore advancement after ending vacation
on:
  push:
    branches: [fix/desktop-18369-vacation-resume]
    paths: ['.github/workflows/build-desktop-updater-18369.yml', '.github/scripts/*18369.py', '.github/scripts/build_desktop_season_18310.ps1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futbr-desktop-18369-signed-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FUTBR_UPDATE_FEED_URL: ${{ vars.FUTBR_UPDATE_FEED_URL }}
      FUTBR_UPDATE_ASSET_BASE_URL: ${{ vars.FUTBR_UPDATE_ASSET_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout 18.369
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          PSExecutionPolicyPreference: Bypass
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test security and preserve previous game improvements
        shell: pwsh
        run: |
          python -m py_compile .github/scripts/fix_vacation_resume_18369.py .github/scripts/test_vacation_resume_18369.py .github/scripts/test_vacation_queue_18369.py .github/scripts/test_vacation_lifecycle_scope_18369.py .github/scripts/test_vacation_resume_browser_18369.py .github/scripts/set_desktop_version_18369.py .github/scripts/make_desktop_update_release_18369.py .github/scripts/verify_desktop_updater_signature_18369.py .github/scripts/publish_signed_update_r2_18369.py .github/scripts/test_unemployed_real_browser_18368.py .github/scripts/fix_unemployed_real_worker_18368.py .github/scripts/test_unemployed_real_worker_18368.py .github/scripts/set_desktop_version_18368.py .github/scripts/make_desktop_update_release_18368.py .github/scripts/verify_desktop_updater_signature_18368.py .github/scripts/publish_signed_update_r2_18368.py .github/scripts/fix_jobwait_real_progress_18367.py .github/scripts/test_jobwait_real_progress_18367.py .github/scripts/set_desktop_version_18367.py .github/scripts/make_desktop_update_release_18367.py .github/scripts/verify_desktop_updater_signature_18367.py .github/scripts/publish_signed_update_r2_18367.py .github/scripts/fix_unemployed_scope_18366.py .github/scripts/test_unemployed_scope_18366.py .github/scripts/set_desktop_version_18366.py .github/scripts/make_desktop_update_release_18366.py .github/scripts/verify_desktop_updater_signature_18366.py .github/scripts/publish_signed_update_r2_18366.py .github/scripts/fix_dismissal_source_18365.py .github/scripts/test_dismissal_source_18365.py .github/scripts/set_desktop_version_18365.py .github/scripts/make_desktop_update_release_18365.py .github/scripts/verify_desktop_updater_signature_18365.py .github/scripts/publish_signed_update_r2_18365.py .github/scripts/fix_vacation_job_handoff_18364.py .github/scripts/test_vacation_job_handoff_18364.py .github/scripts/set_desktop_version_18364.py .github/scripts/make_desktop_update_release_18364.py .github/scripts/verify_desktop_updater_signature_18364.py .github/scripts/publish_signed_update_r2_18364.py .github/scripts/fix_jobwait_state_18363.py .github/scripts/test_jobwait_state_18363.py .github/scripts/set_desktop_version_18363.py .github/scripts/make_desktop_update_release_18363.py .github/scripts/verify_desktop_updater_signature_18363.py .github/scripts/publish_signed_update_r2_18363.py .github/scripts/fix_core_transitions_18362.py .github/scripts/test_core_transitions_18362.py .github/scripts/set_desktop_version_18362.py .github/scripts/make_desktop_update_release_18362.py .github/scripts/verify_desktop_updater_signature_18362.py .github/scripts/publish_signed_update_r2_18362.py .github/scripts/test_vacation_preflight_18360.py .github/scripts/test_vacation_finalize_18360.py .github/scripts/optimize_vacation_finalize_18360.py .github/scripts/set_desktop_version_18360.py .github/scripts/make_desktop_update_release_18360.py .github/scripts/verify_desktop_updater_signature_18360.py .github/scripts/publish_signed_update_r2_18360.py .github/scripts/test_dismissal_preflight_18359.py .github/scripts/test_dismissal_control_18359.py .github/scripts/fix_dismissal_control_18359.py .github/scripts/set_desktop_version_18359.py .github/scripts/make_desktop_update_release_18359.py .github/scripts/verify_desktop_updater_signature_18359.py .github/scripts/publish_signed_update_r2_18359.py .github/scripts/test_dismissal_preflight_18358.py .github/scripts/test_dismissal_button_18358.py .github/scripts/fix_dismissal_button_18358.py .github/scripts/set_desktop_version_18358.py .github/scripts/make_desktop_update_release_18358.py .github/scripts/verify_desktop_updater_signature_18358.py .github/scripts/publish_signed_update_r2_18358.py .github/scripts/test_dismissal_preflight_18357.py .github/scripts/test_dismissal_handoff_18357.py .github/scripts/fix_dismissal_handoff_18357.py .github/scripts/set_desktop_version_18357.py .github/scripts/make_desktop_update_release_18357.py .github/scripts/verify_desktop_updater_signature_18357.py .github/scripts/publish_signed_update_r2_18357.py .github/scripts/test_jobwait_preflight_18356.py .github/scripts/test_jobwait_18356.py .github/scripts/fix_jobwait_18356.py .github/scripts/set_desktop_version_18356.py .github/scripts/make_desktop_update_release_18356.py .github/scripts/verify_desktop_updater_signature_18356.py .github/scripts/publish_signed_update_r2_18356.py .github/scripts/test_job_saveexit_patch_18355.py .github/scripts/test_job_saveexit_18355.py .github/scripts/fix_job_saveexit_18355.py .github/scripts/set_desktop_version_18355.py .github/scripts/make_desktop_update_release_18355.py .github/scripts/verify_desktop_updater_signature_18355.py .github/scripts/publish_signed_update_r2_18355.py .github/scripts/harden_native_save_mirror_18354.py .github/scripts/test_native_save_mirror_18354.py .github/scripts/shard_remaining_archives_18354.py .github/scripts/test_archive_root_shards_18354.py .github/scripts/set_desktop_version_18354.py .github/scripts/make_desktop_update_release_18354.py .github/scripts/verify_desktop_updater_signature_18354.py .github/scripts/publish_signed_update_r2_18354.py .github/scripts/fix_seriec_full_history_18353.py .github/scripts/test_seriec_full_history_18353.py .github/scripts/set_desktop_version_18353.py .github/scripts/make_desktop_update_release_18353.py .github/scripts/verify_desktop_updater_signature_18353.py .github/scripts/publish_signed_update_r2_18353.py .github/scripts/optimize_oomsafe_saves_18352.py .github/scripts/test_oomsafe_saves_18352.py .github/scripts/set_desktop_version_18352.py .github/scripts/make_desktop_update_release_18352.py .github/scripts/verify_desktop_updater_signature_18352.py .github/scripts/publish_signed_update_r2_18352.py .github/scripts/fix_seriec_phases_history_18351.py .github/scripts/test_seriec_phases_history_18351.py .github/scripts/set_desktop_version_18351.py .github/scripts/make_desktop_update_release_18351.py .github/scripts/verify_desktop_updater_signature_18351.py .github/scripts/publish_signed_update_r2_18351.py .github/scripts/fix_calendar_match_retirement_18350.py .github/scripts/test_calendar_match_retirement_18350.py .github/scripts/set_desktop_version_18350.py .github/scripts/make_desktop_update_release_18350.py .github/scripts/verify_desktop_updater_signature_18350.py .github/scripts/publish_signed_update_r2_18350.py .github/scripts/fix_career_isolation_18344.py .github/scripts/test_career_isolation_18344.py .github/scripts/set_desktop_version_18344.py .github/scripts/fix_seriec_champion_18345.py .github/scripts/test_seriec_champion_18345.py .github/scripts/set_desktop_version_18345.py .github/scripts/fix_retirement_vacation_18346.py .github/scripts/test_retirement_vacation_18346.py .github/scripts/set_desktop_version_18346.py .github/scripts/feature_calendar_list_18347.py .github/scripts/test_calendar_list_18347.py .github/scripts/set_desktop_version_18348.py .github/scripts/fix_calendar_nav_version_18348.py .github/scripts/test_calendar_nav_version_18348.py .github/scripts/set_desktop_version_18349.py .github/scripts/optimize_incremental_saves_calendar_18349.py .github/scripts/test_incremental_saves_calendar_18349.py .github/scripts/optimize_season_saves_18343.py .github/scripts/test_season_saves_18343.py .github/scripts/fix_welcome_national_preview_18342.py .github/scripts/test_welcome_national_preview_18342.py .github/scripts/verify_desktop_updater_signature_18349.py .github/scripts/set_desktop_version_18349.py .github/scripts/make_desktop_update_release_18350.py .github/scripts/publish_signed_update_r2_18349.py .github/scripts/fix_initial_nationalities_18340.py .github/scripts/test_initial_nationalities_18340.py .github/scripts/fix_scorers_submit_18340.py .github/scripts/test_scorers_submit_18340.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax error in signed update repair.' }
          python .github/scripts/test_dismissal_source_18365.py --standalone
          if ($LASTEXITCODE -ne 0) { throw '18.365 original click, idempotent button and career layout preflight failed.' }
          python .github/scripts/test_vacation_job_handoff_18364.py --standalone
          if ($LASTEXITCODE -ne 0) { throw '18.364 fired-vacation Worker to job handoff preflight failed.' }
          python .github/scripts/test_fast_updater_18361.py
          if ($LASTEXITCODE -ne 0) { throw '18.361 signed updater frontend and metadata-cache regression failed.' }
          python .github/scripts/test_vacation_preflight_18360.py
          if ($LASTEXITCODE -ne 0) { throw '18.360 non-blocking vacation checkpoint and memory regression failed.' }
          python .github/scripts/test_dismissal_preflight_18359.py
          if ($LASTEXITCODE -ne 0) { throw '18.359 real Worker-finished dismissal and job-button regression failed.' }
          python .github/scripts/test_dismissal_preflight_18358.py
          if ($LASTEXITCODE -ne 0) { throw '18.358 vacation dismissal UI recovery preflight failed.' }
          python .github/scripts/test_dismissal_preflight_18357.py
          if ($LASTEXITCODE -ne 0) { throw '18.357 dismissal checkpoint and job-wait preflight failed.' }
          python .github/scripts/test_jobwait_preflight_18356.py
          if ($LASTEXITCODE -ne 0) { throw '18.356 job-wait new-season preflight failed.' }
          python .github/scripts/test_job_saveexit_patch_18355.py
          if ($LASTEXITCODE -ne 0) { throw '18.355 fast source-patch and coach-offer regression failed.' }
          python .github/scripts/test_desktop_updater_18339.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy updater behavior regression.' }
          python .github/scripts/test_competition_history_context_18339.py
          if ($LASTEXITCODE -ne 0) { throw 'History regression.' }
      - name: Fail closed unless signing private key is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'The original Tauri signing key is missing; refusing to generate untrusted updates.'
          }
      - name: Rust Windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Derive and lock public key from the original signing private key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'futbr-updater-public-18354.b64'
          cargo run --release --quiet --manifest-path '.github/tools/derive_tauri_pubkey/Cargo.toml' -- $path
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $path)) { throw 'Cannot derive public key from existing private signer.' }
          $pub = (Get-Content $path -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($pub)) { throw 'Derived public key is empty.' }
          "FUTBR_UPDATER_PUBLIC_KEY=$pub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FUTBR_DERIVED_PUBKEY_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Matching Tauri updater public key derived in memory; private key remains secret.'
      - name: Browser regression prerequisites
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Single Windows build - all past fixes plus corrected update trust
        shell: pwsh
        run: .github/scripts/build_desktop_season_18310.ps1
      - name: Stage prepared game source for diagnostics
        if: ${{ failure() && env.FUTBR_PROJECT != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticRoot = Join-Path $env:RUNNER_TEMP 'futbr-source-diagnostic-18369'
          $preparedRoot = Join-Path $diagnosticRoot 'prepared'
          $reportRoot = Join-Path $diagnosticRoot 'reports'
          New-Item -ItemType Directory -Force -Path $preparedRoot,$reportRoot | Out-Null
          $gameSource = Join-Path $env:FUTBR_PROJECT 'src'
          if (-not (Test-Path (Join-Path $gameSource 'index.html'))) {
            throw 'Prepared game source is unavailable for diagnostics.'
          }
          # Source and tests only: no signer files, environment dump, native
          # target directory, credentials, or installer artifacts are included.
          Copy-Item -LiteralPath $gameSource -Destination (Join-Path $preparedRoot 'src') -Recurse
          $scriptRoot = Join-Path $diagnosticRoot 'scripts'
          New-Item -ItemType Directory -Force -Path $scriptRoot | Out-Null
          $trackedScripts = git ls-files -- '.github/scripts'
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate tracked diagnostic scripts.' }
          foreach ($trackedPath in $trackedScripts) {
            $relativeScript = $trackedPath.Substring('.github/scripts/'.Length)
            $scriptTarget = Join-Path $scriptRoot $relativeScript
            New-Item -ItemType Directory -Force -Path (Split-Path $scriptTarget -Parent) | Out-Null
            Copy-Item -LiteralPath $trackedPath -Destination $scriptTarget
          }
          Get-ChildItem -LiteralPath $env:FUTBR_PROJECT -File -Filter '*-tests.json' |
            Copy-Item -Destination $reportRoot
          Get-ChildItem -LiteralPath $env:FUTBR_PROJECT -File -Filter '*-install.json' |
            Copy-Item -Destination $reportRoot
          $sourceHash = (Get-FileHash (Join-Path $gameSource 'index.html') -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = [ordered]@{
            purpose = 'Prepared source diagnostics only; not an installer or release approval'
            commit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            ref = $env:GITHUB_REF_NAME
            htmlSha256 = $sourceHash
            utc = [DateTime]::UtcNow.ToString('o')
          }
          $metadata | ConvertTo-Json | Set-Content (Join-Path $diagnosticRoot 'manifest.json') -Encoding utf8
          $entries = Get-ChildItem -LiteralPath $diagnosticRoot -Recurse -File |
            Sort-Object FullName | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($diagnosticRoot, $_.FullName).Replace('\','/')
              $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$digest  $relative"
            }
          $entries | Set-Content (Join-Path $diagnosticRoot 'SHA256SUMS.txt') -Encoding utf8
          "FUTBR_DIAGNOSTIC_SOURCE=$diagnosticRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload prepared source and test diagnostics
        if: ${{ always() && env.FUTBR_DIAGNOSTIC_SOURCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Source-Diagnostics-18.369-${{ github.run_id }}
          path: ${{ env.FUTBR_DIAGNOSTIC_SOURCE }}/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Package signed candidate for restricted artifact retention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/make_desktop_update_release_18369.py "$env:FUTBR_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Missing signed 18.354 NSIS candidate.' }
          $art = Join-Path $env:FUTBR_PROJECT 'artifacts'
          foreach ($file in @('FutBR-Manager-18.369-Windows.exe','FutBR-Manager-18.369-Windows.exe.sig','latest.json','SHA256SUMS.txt')) {
            if (-not (Test-Path (Join-Path $art $file))) { throw "Missing mandatory signed 18.354 release file: $file" }
          }
          $manifest = Get-Content (Join-Path $art 'latest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne '18.369.0') { throw 'Release manifest does not match the compiled 18.369 Windows version.' }

      - name: Upload restricted installer candidate before independent cryptographic verification
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-18.369-PRIVATE-CANDIDATE-DO-NOT-DISTRIBUTE
          path: |
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-18.369-Windows.exe
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-18.369-Windows.exe.sig
            ${{ env.FUTBR_PROJECT }}/artifacts/latest.json
            ${{ env.FUTBR_PROJECT }}/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
      - name: Cryptographically verify installer and gate publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/verify_desktop_updater_signature_18369.py "$env:FUTBR_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'SECURITY: Public key does not match installer or release signature.' }
          $art = Join-Path $env:FUTBR_PROJECT 'artifacts'
          $installer = Join-Path $art 'FutBR-Manager-18.369-Windows.exe'
          $sig = Join-Path $art 'FutBR-Manager-18.369-Windows.exe.sig'
          cargo run --release --quiet --manifest-path '.github/tools/derive_tauri_pubkey/Cargo.toml' -- verify "$env:FUTBR_DERIVED_PUBKEY_FILE" "$installer" "$sig"
          if ($LASTEXITCODE -ne 0) { throw 'SECURITY: Cryptographic Minisign verification of Windows installer failed.' }
          $nationalities = Get-Content (Join-Path $art 'initial-nationalities-18340-tests.json') -Raw | ConvertFrom-Json
          $search = Get-Content (Join-Path $art 'scorers-submit-18340-tests.json') -Raw | ConvertFrom-Json
          $save = Get-Content (Join-Path $art 'long-career-saves-18338-tests.json') -Raw | ConvertFrom-Json
          $history = Get-Content (Join-Path $art 'champions-retirement-18322-tests.json') -Raw | ConvertFrom-Json
          $version = Get-Content (Join-Path $art 'desktop-version-18369-install.json') -Raw | ConvertFrom-Json
          $welcome = Get-Content (Join-Path $art 'welcome-national-preview-18342-tests.json') -Raw | ConvertFrom-Json
          $seasonSave = Get-Content (Join-Path $art 'season-save-18343-tests.json') -Raw | ConvertFrom-Json
          $careerIsolation = Get-Content (Join-Path $art 'career-isolation-18344-tests.json') -Raw | ConvertFrom-Json
          $serieC = Get-Content (Join-Path $art 'serie-c-champion-18345-tests.json') -Raw | ConvertFrom-Json
          $retirement = Get-Content (Join-Path $art 'retirement-vacation-18346-tests.json') -Raw | ConvertFrom-Json
          $calendar = Get-Content (Join-Path $art 'calendar-list-18347-tests.json') -Raw | ConvertFrom-Json
          $calendarNav = Get-Content (Join-Path $art 'calendar-nav-version-18348-tests.json') -Raw | ConvertFrom-Json
          $saveFast = Get-Content (Join-Path $art 'incremental-saves-calendar-18349-tests.json') -Raw | ConvertFrom-Json
          $matchRetire = Get-Content (Join-Path $art 'calendar-retirement-18350-tests.json') -Raw | ConvertFrom-Json
          $serieC351 = Get-Content (Join-Path $art 'serie-c-phases-history-18351-tests.json') -Raw | ConvertFrom-Json
          $save352 = Get-Content (Join-Path $art 'oomsafe-save-18352-tests.json') -Raw | ConvertFrom-Json
          $podium353 = Get-Content (Join-Path $art 'serie-c-full-history-18353-tests.json') -Raw | ConvertFrom-Json
          $fast361 = Get-Content (Join-Path $art 'fast-updater-18361-tests.json') -Raw | ConvertFrom-Json
          if (-not $fast361.ok -or $fast361.version -ne '18.361.0' -or -not $fast361.cachedOnlyTrustedMetadata -or -not $fast361.saveBeforeInstall -or -not $fast361.secondHTTPManifestCheckAvoided -or -not $fast361.liveDownloadPercentage -or -not $fast361.signedInstallerRemainsOnlyNativePath -or -not $fast361.noInstallerPrefetch -or -not $fast361.samePerUserInstaller -or -not $fast361.progressDoesNotBypassSave -or -not $fast361.directCDN) { throw '18.361 updater performance or signing trust regression failed.' }
          $vac360 = Get-Content (Join-Path $art 'vacation-finalize-18360-tests.json') -Raw | ConvertFrom-Json
          if (-not $vac360.ok -or $vac360.version -ne '18.360.0' -or -not $vac360.manifestCommittedBeforeCleanup -or -not $vac360.rollbackCheckpointRetained -or -not $vac360.immutablePlayerArchivePreserved -or -not $vac360.serializedBackgroundCleanup -or $vac360.batchBoundedAfter2028 -ne 640 -or -not $vac360.workerBackpressurePreserved -or -not $vac360.playerLosslessCodecPreserved -or -not $vac360.nonBlockingUILiveProgress -or -not $vac360.noHeavyRenderPerBatch -or -not $vac360.realDismissal18359Preserved -or $vac360.workerFullWorldExtraSave) { throw '18.360 vacation completion performance and checkpoint safety regression failed.' }
          $dismiss359 = Get-Content (Join-Path $art 'dismissal-control-18359-tests.json') -Raw | ConvertFrom-Json
          if (-not $dismiss359.ok -or $dismiss359.version -ne '18.359.0' -or -not $dismiss359.actualFinishedWorkerSignal -or -not $dismiss359.headersReenabledAfterLegacyPaint -or -not $dismiss359.jobWaitClickUnblocked -or -not $dismiss359.noAdvanceWhilePromotionInFlight -or -not $dismiss359.firstWorkerDayUsesSynchronizedWorld -or -not $dismiss359.realOfferModalAppears -or -not $dismiss359.noUnlockOnActiveWorker -or -not $dismiss359.noUnlockOnPartialStream -or -not $dismiss359.nationalCareerProtected -or -not $dismiss359.careerIdentityProtected -or -not $dismiss359.workerErrorsCannotUnlock -or -not $dismiss359.zeroDuplicateWorldSaves) { throw '18.359 Worker-finished dismissal regression not verified.' }
          $dismiss358 = Get-Content (Join-Path $art 'dismissal-button-18358-tests.json') -Raw | ConvertFrom-Json
          if (-not $dismiss358.ok -or $dismiss358.version -ne '18.358.0' -or -not $dismiss358.alreadyFinishedVacationUnlocksJobButton -or -not $dismiss358.staleOverlayAndSaverDoNotBlock -or -not $dismiss358.inFlightWorkerProtected -or -not $dismiss358.incompletePlayerWorldProtected -or -not $dismiss358.careerIdentityProtected -or -not $dismiss358.noReleaseBeforeCheckpointSettles -or -not $dismiss358.failedCheckpointUsesLiveMemory -or -not $dismiss358.seasonEndAdvancesToOffers -or -not $dismiss358.seasonEndWithoutDismissalRecoveryWorks -or -not $dismiss358.preservesTurboSimulation) { throw '18.358 dismissal button recovery and real Worker safety test failed.' }
          $dismiss357 = Get-Content (Join-Path $art 'dismissal-handoff-18357-tests.json') -Raw | ConvertFrom-Json
          if (-not $dismiss357.ok -or $dismiss357.version -ne '18.357.0' -or -not $dismiss357.endOfVacationCheckpointBeforeJobUnlock -or -not $dismiss357.neverSavesFullWorldTwice -or -not $dismiss357.careerYearDayEmploymentAudited -or -not $dismiss357.fallbackUsesLiveStateSafely -or -not $dismiss357.previousSaveNotReplayed -or -not $dismiss357.inFlightWorkerProtected -or -not $dismiss357.otherCareerProtected -or -not $dismiss357.nationalManagerProtected -or -not $dismiss357.oneAuditOnePromotion) { throw '18.357 dismissal after-sync handoff regression failed.' }
          $jobs356 = Get-Content (Join-Path $art 'jobwait-season-18356-tests.json') -Raw | ConvertFrom-Json
