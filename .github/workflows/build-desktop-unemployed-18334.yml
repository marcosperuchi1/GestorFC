name: Build FutBR Manager 18.334 - demissao durante ferias
on:
  push:
    branches: [fix-unemployed-18334]
    paths:
      - '.github/workflows/build-desktop-unemployed-18334.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futbr-desktop-unemployed-18334
  cancel-in-progress: true
jobs:
  build:
    name: Testar e gerar instalador Windows 18.334
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Obter o codigo da versao 18.334
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Rust para Windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Preparar navegador de testes
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Falha na instalacao do Playwright' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falha na instalacao do Chromium' }
      - name: Compilar FutBR 18.334 com teste do save 2031
        shell: pwsh
        run: .github/scripts/build_desktop_season_18310.ps1
      - name: Confirmar regressao corrigida e instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:FUTBR_PROJECT 'artifacts'
          $installer = Join-Path $artifactDir 'FutBR-Manager-Desktop-RC1-INSTALADOR.exe'
          $report = Join-Path $artifactDir 'unemployed-resume-18334-tests.json'
          if (-not (Test-Path $installer)) { throw 'Instalador final nao foi encontrado.' }
          if (-not (Test-Path $report)) { throw 'Teste do desempregado nao foi executado.' }
          $test = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $test.ok -or -not $test.recovered2031 -or -not $test.noConcurrentWorker -or -not $test.exactCheckpointRequired) {
            throw 'Regressao de demissao durante ferias nao validada.'
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FutBR-Manager-Desktop-RC1-INSTALADOR.exe" | Set-Content (Join-Path $artifactDir 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "Instalador final validado. SHA256=$hash"
          Get-ChildItem $artifactDir | Select-Object Name,Length
      - name: Enviar instalador Windows corrigido para download
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-18.334-Windows-Corrigido
          path: |
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-Desktop-RC1-INSTALADOR.exe
            ${{ env.FUTBR_PROJECT }}/artifacts/SHA256SUMS.txt
            ${{ env.FUTBR_PROJECT }}/artifacts/unemployed-resume-18334-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/unemployed-resume-18334-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/unemployed-turbo-18327-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/scout-18331-tests.json
          if-no-files-found: error
          retention-days: 7
