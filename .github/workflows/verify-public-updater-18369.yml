name: Verify published FutBR 18.369 updater and installer

on:
  push:
    branches: [fix/desktop-18369-vacation-resume]
    paths: ['.github/workflows/verify-public-updater-18369.yml']

permissions:
  contents: read

concurrency:
  group: futbr-public-updater-verification-18369
  cancel-in-progress: true

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # REQUIRED: copy the installer SHA-256 from the successfully signed and
      # verified 18.369 build, then commit this workflow only after publication.
      # This placeholder fails closed before making any network request.
      EXPECTED_SHA256: 'd5ce5482a7110c963c8c2d565d6cd856f51499bfaecaabe665e68464ba9e498e'
    steps:
      - name: Read official feed, signature and complete installer
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          VERSION = '18.369.0'
          HOST = 'download.futbrmanager.com.br'
          BASE = 'https://' + HOST + '/updates/'
          FEED = BASE + 'latest.json'
          INSTALLER = BASE + 'FutBR-Manager-18.369-Windows.exe'
          SIGNATURE = INSTALLER + '.sig'
          MIN_INSTALLER_BYTES = 40_000_000
          MAX_INSTALLER_BYTES = 200_000_000
          expected = os.environ['EXPECTED_SHA256'].strip().lower()
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise RuntimeError('EXPECTED_SHA256 must be filled from the verified signed 18.369 build before this workflow is committed.')

          def require_official_url(url, expected_path=None):
              parsed = urllib.parse.urlsplit(url)
              if (parsed.scheme != 'https' or parsed.hostname != HOST
                      or parsed.port not in (None, 443)
                      or parsed.username is not None or parsed.password is not None
                      or parsed.query or parsed.fragment):
                  raise RuntimeError('Refusing an unexpected URL or origin: ' + url)
              if expected_path is not None and parsed.path != expected_path:
                  raise RuntimeError('Refusing an unexpected resource redirect: ' + url)
              return parsed

          class OfficialRedirectsOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  current = require_official_url(req.full_url)
                  target = urllib.parse.urljoin(req.full_url, newurl)
                  require_official_url(target, current.path)
                  return super().redirect_request(req, fp, code, msg, headers, target)

          opener = urllib.request.build_opener(OfficialRedirectsOnly())
          headers = {
              'User-Agent': 'FutBR-Public-Release-Verification/18.369',
              'Cache-Control': 'no-cache',
              'Accept-Encoding': 'identity',
          }

          def open_official(url, accept):
              wanted = require_official_url(url)
              response = opener.open(urllib.request.Request(
                  url, headers={**headers, 'Accept': accept}), timeout=60)
              try:
                  require_official_url(response.geturl(), wanted.path)
                  if response.status != 200:
                      raise RuntimeError('Expected HTTP 200 for ' + url + ', got ' + str(response.status))
                  if response.headers.get('Content-Encoding', 'identity').lower() not in ('', 'identity'):
                      raise RuntimeError('Unexpected content encoding for ' + url)
                  return response
              except Exception:
                  response.close()
                  raise

          def read_small(url, limit, accept):
              with open_official(url, accept) as response:
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise RuntimeError('Oversized response for ' + url)
                  declared = response.headers.get('Content-Length')
                  if declared is not None and int(declared) != len(body):
                      raise RuntimeError('Truncated response for ' + url)
                  return body

          manifest = json.loads(read_small(FEED, 131072, 'application/json').decode('utf-8'))
          if manifest.get('version') != VERSION:
              raise RuntimeError('The public feed does not announce ' + VERSION)
          platform = manifest.get('platforms', {}).get('windows-x86_64', {})
          if platform.get('url') != INSTALLER:
              raise RuntimeError('The public installer URL differs from the official 18.369 asset')
          signature = platform.get('signature')
          if not isinstance(signature, str) or len(signature) < 32:
              raise RuntimeError('The public manifest has no valid signature payload')
          # The trusted build already performs cryptographic Minisign verification.
          # Here verify the CDN serves the exact signature payload from its feed.
          try:
              decoded_signature = base64.b64decode(signature, validate=True)
          except Exception as error:
              raise RuntimeError('The manifest signature is not valid base64') from error
          if not decoded_signature:
              raise RuntimeError('The manifest signature payload is empty')
          sig_bytes = read_small(SIGNATURE, 16384, 'application/octet-stream')
          canonical_sig = signature.encode('utf-8')
          # make_desktop_update_release_18369.py writes the manifest signature
          # plus one native line ending; Windows produces CRLF. No other
          # normalization, whitespace trimming or signature substitution occurs.
          if sig_bytes not in (canonical_sig + b'\n', canonical_sig + b'\r\n'):
              raise RuntimeError('The public .sig file does not exactly match the manifest signature and its packaging line ending')

          digest = hashlib.sha256()
          size = 0
          first_bytes = b''
          with open_official(INSTALLER, 'application/octet-stream') as response:
              declared = response.headers.get('Content-Length')
              if declared is not None and not MIN_INSTALLER_BYTES <= int(declared) <= MAX_INSTALLER_BYTES:
                  raise RuntimeError('The public installer has an unexpected Content-Length')
              while True:
                  block = response.read(1024 * 1024)
                  if not block:
                      break
                  if size == 0:
                      first_bytes = block[:2]
                  size += len(block)
                  if size > MAX_INSTALLER_BYTES:
                      raise RuntimeError('The public installer exceeds the expected size range')
                  digest.update(block)
              if declared is not None and size != int(declared):
                  raise RuntimeError('The full installer download does not match Content-Length')
          if not MIN_INSTALLER_BYTES <= size <= MAX_INSTALLER_BYTES:
              raise RuntimeError('The full installer download has an unexpected size')
          if first_bytes != b'MZ':
              raise RuntimeError('The public download is not a Windows executable')
          actual = digest.hexdigest()
          if actual != expected:
              raise RuntimeError('The public installer SHA-256 does not match the verified signed build: ' + actual)
          print(json.dumps({
              'ok': True,
              'version': VERSION,
              'feed': FEED,
              'installer': INSTALLER,
              'httpStatus': 200,
              'officialOriginOnly': True,
              'manifestSignatureMatchesPublicSig': True,
              'completeInstallerDownloaded': True,
              'installerBytes': size,
              'sha256': actual,
              'sha256MatchesVerifiedSignedBuild': True,
          }, ensure_ascii=False))
          PY
