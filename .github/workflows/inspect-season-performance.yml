name: Validar sincronizacao e temporadas 18.310
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-season-performance.yml'
      - '.github/scripts/optimize_season_sync_18310.py'
      - '.github/scripts/test_season_sync_18310.py'
      - '.github/scripts/test_history_incremental_18310.py'
      - '.github/scripts/diagnose_new_season_vacation_18311.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de testes
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar testes.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar navegador.' }
      - name: Reconstruir fonte 18.301 e aplicar 18.310
        shell: pwsh
        run: |
          python .github/scripts/inspect_season_performance.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao reconstruir fonte.' }
      - name: Diagnosticar bloqueio ao iniciar ferias na nova temporada
        shell: pwsh
        run: |
          python .github/scripts/diagnose_new_season_vacation_18311.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha no diagnostico da nova temporada.' }
      - name: Aplicar e validar correcao de sincronizacao
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('optimize_season_sync_18310','test_season_sync_18310','test_history_incremental_18310','test_runtime_boot','test_rankings_18230','test_incremental_ranking_18300','test_root_gameplay','test_relational_history')) {
            python ".github/scripts/$script.py" "$env:FUTBR_INSPECT_PROJECT"
            if ($LASTEXITCODE -ne 0) { throw "Falha em $script" }
          }
      - name: Relatorios de integridade
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:FUTBR_INSPECT_PROJECT" -Filter '*18310*.json' | ForEach-Object {
            Write-Host "REPORT $($_.Name)"
            Get-Content $_.FullName
          }
