name: Inspecao de desempenho somente leitura
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-season-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir fonte local para inspecao
        shell: pwsh
        run: python .github/scripts/inspect_season_performance.py
      - name: Ler etapas anuais e armazenamento nativo
        shell: python
        run: |
          import os, re, sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding='utf-8')
          project=Path(os.environ['FUTBR_INSPECT_PROJECT'])
          html=(project/'src/index.html').read_text(encoding='utf-8')
          terms=['function v91FastNextSeasonCore(', 'function v91AgePlayers(', 'function v91ResetPlayers(', 'function v94PackCurrentCareerArchive(', 'async function v93ApplyVacationCheckpoint(', 'const shards=', 'async function v18117WaitSyncAck(', 'function v91Archive', 'function v91NextSeason']
          spans=[]
          for term in terms:
              found=list(re.finditer(re.escape(term),html))
              print('INDEX',repr(term),'positions',[m.start() for m in found])
              for m in found[:2]:spans.append((max(0,m.start()-500),min(len(html),m.start()+11000)))
          merged=[]
          for a,b in sorted(spans):
              if merged and a<=merged[-1][1]:merged[-1]=(merged[-1][0],max(b,merged[-1][1]))
              else:merged.append((a,b))
          for a,b in merged:
              print('SOURCE',a,b)
              print(html[a:b])
          native=(project/'src-tauri/src/lib.rs').read_text(encoding='utf-8')
          print('NATIVE',native)
