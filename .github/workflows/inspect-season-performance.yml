name: Validar sincronizacao e temporadas 18.310
# trigger 18.317
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-season-performance.yml'
      - '.github/scripts/optimize_season_sync_18310.py'
      - '.github/scripts/test_season_sync_18310.py'
      - '.github/scripts/test_history_incremental_18310.py'
      - '.github/scripts/diagnose_new_season_vacation_18311.py'
      - '.github/scripts/fix_new_season_vacation_18311.py'
      - '.github/scripts/test_new_season_vacation_18311.py'
      - '.github/scripts/optimize_rankings_finals_18312.py'
      - '.github/scripts/test_rankings_finals_18312.py'
      - '.github/scripts/optimize_career_runtime_18313.py'
      - '.github/scripts/test_runtime_18313.py'
      - '.github/scripts/fix_rank_details_18314.py'
      - '.github/scripts/test_rank_details_18314.py'
      - '.github/scripts/fix_rank_titles_sparse_18315.py'
      - '.github/scripts/test_rank_titles_sparse_18315.py'
      - '.github/scripts/fix_rank_rollover_18316.py'
      - '.github/scripts/test_rank_rollover_18316.py'
      - '.github/scripts/fix_rank_titles_18317.py'
      - '.github/scripts/test_rank_titles_18317.py'
      - '.github/scripts/rebuild_rankings_18318.py'
      - '.github/scripts/test_rankings_18318.py'
      - '.github/scripts/clean_rankings_18320.py'
      - '.github/scripts/test_rankings_clean_18320.py'
      - '.github/scripts/fix_rankings_ui_18321.py'
      - '.github/scripts/test_rankings_ui_18321.py'
      - '.github/scripts/feature_champions_retirement_18322.py'
      - '.github/scripts/test_champions_retirement_18322.py'
      - '.github/scripts/optimize_unemployed_turbo_18327.py'
      - '.github/scripts/test_unemployed_turbo_18327.py'
      - '.github/scripts/device_session_patch_18329.js'
      - '.github/scripts/fix_device_sessions_18329.py'
      - '.github/scripts/test_device_sessions_18329.py'
      - 'supabase/functions/release-device/index.ts'
      - '.github/scripts/build_desktop_season_18310.ps1'
      - '.github/workflows/build-season-sync-18310.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de testes
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar testes.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar navegador.' }
      - name: Reconstruir fonte 18.301 e aplicar 18.310
        shell: pwsh
        run: |
          python .github/scripts/inspect_season_performance.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao reconstruir fonte.' }
      - name: Aplicar 18.310 a 18.317
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/optimize_season_sync_18310.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.310.' }
          python .github/scripts/fix_new_season_vacation_18311.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.311.' }
          python .github/scripts/optimize_rankings_finals_18312.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.312.' }
          python .github/scripts/optimize_career_runtime_18313.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.313.' }
          python .github/scripts/fix_rank_details_18314.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.314.' }
          python .github/scripts/fix_rank_titles_sparse_18315.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.315.' }
          python .github/scripts/fix_rank_rollover_18316.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.316.' }
          python .github/scripts/fix_rank_titles_18317.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.317.' }
          python .github/scripts/rebuild_rankings_18318.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar 18.318.' }
      - name: Diagnosticar bloqueio ao iniciar ferias na nova temporada
        shell: pwsh
        run: |
          python .github/scripts/diagnose_new_season_vacation_18311.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha no diagnostico da nova temporada.' }
      - name: Disponibilizar codigo montado apenas para diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Source-Debug-18318
          path: |
            ${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/src/index.html
            ${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/new-season-vacation-18311-diagnostic.json
          if-no-files-found: warn
          retention-days: 1
      - name: Aplicar e validar correcao de sincronizacao
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('test_rankings_18318','test_rank_titles_18317','test_rank_rollover_18316','test_rank_titles_sparse_18315','test_rank_details_18314','test_runtime_18313','test_rankings_finals_18312','test_season_sync_18310','test_new_season_vacation_18311','test_history_incremental_18310','test_runtime_boot','test_rankings_18230','test_incremental_ranking_18300','test_root_gameplay','test_relational_history')) {
            python ".github/scripts/$script.py" "$env:FUTBR_INSPECT_PROJECT"
            if ($LASTEXITCODE -ne 0) { throw "Falha em $script" }
          }
      - name: Instalar ranking limpo 18.320 e testar rota real da tela
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/clean_rankings_18320.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar motor limpo 18.320.' }
          python .github/scripts/test_rankings_clean_18320.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha no teste da tela real 18.320.' }
      - name: Disponibilizar codigo LIMPO 18.320 para verificacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Source-Debug-18320
          path: |
            ${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/src/index.html
            ${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/ranking-clean-18320-install.json
            ${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/ranking-clean-18320-tests.json
          if-no-files-found: warn
          retention-days: 2
      - name: Validar abas e desligar ranking duplicado 18.321
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/fix_rankings_ui_18321.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao corrigir abas 18.321.' }
          python .github/scripts/test_rankings_ui_18321.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha nos testes de navegacao 18.321.' }
      - name: Publicar HTML validado 18.321 para diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Source-Debug-18321
          path: |
            \${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/src/index.html
            \${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/ranking-ui-18321-install.json
            \${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/ranking-ui-18321-tests.json
          if-no-files-found: warn
          retention-days: 2
      - name: Verificar historico completo de campeoes e aposentadoria 18.322
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/feature_champions_retirement_18322.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar historicos e aposentadorias 18.322.' }
          python .github/scripts/test_champions_retirement_18322.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha nos testes de historico de campeoes e aposentadorias 18.322.' }
          python .github/scripts/optimize_unemployed_turbo_18327.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar modo Turbo apos demissao 18.327.' }
          python .github/scripts/test_unemployed_turbo_18327.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Modo Turbo sem clube nao preservou ofertas ou resultados 18.327.' }
          python .github/scripts/fix_device_sessions_18329.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar correcoes de dispositivos 18.329.' }
          python .github/scripts/test_device_sessions_18329.py "$env:FUTBR_INSPECT_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Falha na validacao de logout e dispositivos 18.329.' }
      - name: Publicar codigo e relatorios 18.322
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Source-Debug-18322
          path: |
            \${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/src/index.html
            \${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/champions-retirement-18322-install.json
            \${{ runner.temp }}/futbr-season-inspection/FutBR_Manager_Desktop_RC1/champions-retirement-18322-tests.json
          if-no-files-found: warn
          retention-days: 2
      - name: Relatorios de integridade
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:FUTBR_INSPECT_PROJECT" -Filter '*1831*.json' | ForEach-Object {
            Write-Host "REPORT $($_.Name)"
            Get-Content $_.FullName
          }
