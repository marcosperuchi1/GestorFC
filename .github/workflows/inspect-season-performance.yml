name: Inspecao de desempenho somente leitura
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-season-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir fonte local para inspecao
        shell: pwsh
        run: python .github/scripts/inspect_season_performance.py
      - name: Ler caminhos finais de transferencia e virada
        shell: python
        run: |
          import os, re, sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding='utf-8')
          html = (Path(os.environ['FUTBR_INSPECT_PROJECT']) / 'src/index.html').read_text(encoding='utf-8')
          spans = [(14498500,14506500),(15709000,15749000),(13431000,13449000)]
          for term in ['v171DropManifest', "kind:'vac-sync-start'", "kind:'vac-sync-part'", 'async function v125', 'async function v171', "m.op==='next'"]:
              matches = list(re.finditer(re.escape(term), html))
              print('INDEX', repr(term), 'positions', [m.start() for m in matches])
              for m in matches[:8]:
                  spans.append((max(0,m.start()-1400),min(len(html),m.start()+8000)))
          merged = []
          for a,b in sorted(spans):
              if merged and a<=merged[-1][1]:
                  merged[-1]=(merged[-1][0],max(b,merged[-1][1]))
              else:
                  merged.append((a,b))
          for a,b in merged:
              print('\nSOURCE',a,b)
              print(html[a:b])
