name: Gerar EXE Windows portatil

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-exe:
    name: Tauri Windows x64 sem instalador
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair pacote, se foi enviado somente o ZIP
        shell: pwsh
        run: |
          $pacote = 'GestorFC_Tauri_18_121_GITHUB.zip'
          if (Test-Path -LiteralPath $pacote) {
            Write-Host 'Pacote ZIP encontrado. Restaurando projeto...'
            Expand-Archive -LiteralPath $pacote -DestinationPath . -Force
          }
          if (-not (Test-Path 'src-tauri/tauri.conf.json')) {
            throw 'Nao achei src-tauri/tauri.conf.json; envie o pacote correto.'
          }

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restaurar HTML offline e conferir hash SHA-256
        shell: pwsh
        run: python scripts/prepare_frontend.py

      - name: Instalar Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          targets: x86_64-pc-windows-msvc

      - name: Resolver dependencias no Cargo.lock
        shell: pwsh
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar Tauri CLI 2.12.2
        shell: pwsh
        run: cargo install tauri-cli --version 2.12.2 --locked

      - name: Compilar EXE do jogo, sem MSI e sem NSIS
        shell: pwsh
        run: cargo tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: Preparar EXE portatil
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/x86_64-pc-windows-msvc/release/gestor-fc-mundo.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            Get-ChildItem -Path src-tauri/target -Recurse -Filter '*.exe' | Select-Object -ExpandProperty FullName
            throw 'EXE do jogo nao foi encontrado apos compilar.'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination 'dist/GestorFC-Mundo-v18.121-PORTATIL.exe'
          Get-Item -LiteralPath 'dist/GestorFC-Mundo-v18.121-PORTATIL.exe' | Format-List Name,Length

      - name: Entregar EXE nos Artifacts do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GestorFC-Mundo-v18.121-Windows-portatil
          path: dist/GestorFC-Mundo-v18.121-PORTATIL.exe
          if-no-files-found: error
          retention-days: 14
