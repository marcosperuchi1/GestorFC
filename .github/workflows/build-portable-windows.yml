name: Build FutBR Manager Desktop RC1 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Tauri Windows x64 - portatil e instalador
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Remontar e extrair pacote Desktop RC1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pacote = 'FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip'

          if (-not (Test-Path -LiteralPath $pacote)) {
            $partes = Get-ChildItem -File 'FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*' | Sort-Object Name
            if (-not $partes -or $partes.Count -eq 0) {
              throw 'Envie o ZIP completo ou todas as partes .part01, .part02, etc. para a raiz do repositorio.'
            }

            Write-Host "Remontando $pacote a partir de $($partes.Count) partes..."
            $saida = [System.IO.File]::Open($pacote, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
            try {
              foreach ($parte in $partes) {
                Write-Host "Adicionando $($parte.Name) - $($parte.Length) bytes"
                $entrada = [System.IO.File]::OpenRead($parte.FullName)
                try { $entrada.CopyTo($saida) } finally { $entrada.Dispose() }
              }
            } finally {
              $saida.Dispose()
            }
          }

          $hashFile = 'FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.sha256.txt'
          if (Test-Path -LiteralPath $hashFile) {
            $esperado = ((Get-Content -LiteralPath $hashFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $obtido = (Get-FileHash -LiteralPath $pacote -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($obtido -ne $esperado) {
              throw "Falha de integridade: SHA-256 esperado $esperado, obtido $obtido."
            }
            Write-Host "SHA-256 validado: $obtido"
          }

          $work = Join-Path $env:RUNNER_TEMP 'futbr-desktop-rc1'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -LiteralPath $pacote -DestinationPath $work -Force
          $project = Join-Path $work 'FutBR_Manager_Desktop_RC1'
          $tauriConfig = Join-Path $project 'src-tauri/tauri.conf.json'
          if (-not (Test-Path $tauriConfig)) {
            throw 'Projeto Tauri nao encontrado dentro do ZIP.'
          }

          # Tauri 2 atual usa "currentUser" (nao "perUser") para instalacao sem administrador.
          $cfg = Get-Content -LiteralPath $tauriConfig -Raw
          $cfg = $cfg.Replace('"installMode": "perUser"', '"installMode": "currentUser"')
          Set-Content -LiteralPath $tauriConfig -Value $cfg -Encoding utf8
          Write-Host 'Configuracao NSIS ajustada para installMode=currentUser.'

          "FUTBR_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.FUTBR_PROJECT }}/src-tauri -> target

      - name: Instalar Tauri CLI
        shell: pwsh
        working-directory: ${{ env.FUTBR_PROJECT }}
        run: npm install

      - name: Compilar EXE e instaladores
        shell: pwsh
        working-directory: ${{ env.FUTBR_PROJECT }}
        run: npm run tauri build

      - name: Montar pacote portatil e instalador
        shell: pwsh
        working-directory: ${{ env.FUTBR_PROJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path portable | Out-Null

          $exe = 'src-tauri/target/release/futbr-manager.exe'
          if (!(Test-Path $exe)) { throw "EXE nao encontrado: $exe" }

          Copy-Item $exe 'portable/FutBR Manager.exe'
          Set-Content -Path 'portable/portable.flag' -Value 'FutBR Manager portable mode' -Encoding ascii
          Set-Content -Path 'portable/LEIA-ME.txt' -Value @'
          FUTBR MANAGER - DESKTOP RC1 PORTATIL

          Extraia toda a pasta e execute FutBR Manager.exe.
          Nao apague portable.flag.
          Os saves ficam em FutBR Manager Data\saves ao lado do EXE.
          F11 alterna tela cheia. Alt+F4 fecha o jogo.
          '@ -Encoding utf8
          Compress-Archive -Path 'portable/*' -DestinationPath 'artifacts/FutBR-Manager-Desktop-RC1-PORTATIL.zip' -Force

          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName 'artifacts/FutBR-Manager-Desktop-RC1-INSTALADOR.exe' }

          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName 'artifacts/FutBR-Manager-Desktop-RC1.msi' }

          Get-ChildItem artifacts | Format-Table Name,Length

      - name: Entregar builds
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-Desktop-RC1-Windows
          path: ${{ env.FUTBR_PROJECT }}/artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
