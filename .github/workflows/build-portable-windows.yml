name: Build FutBR Manager Desktop RC1 Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Tauri Windows x64 - portatil e instalador
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Remontar e extrair pacote Desktop RC1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pacote = 'FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip'

          if (-not (Test-Path -LiteralPath $pacote)) {
            $partes = Get-ChildItem -File 'FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*' | Sort-Object Name
            if (-not $partes -or $partes.Count -eq 0) {
              throw 'Envie o ZIP completo ou todas as partes .part01, .part02, etc. para a raiz do repositorio.'
            }

            Write-Host "Remontando $pacote a partir de $($partes.Count) partes..."
            $saida = [System.IO.File]::Open($pacote, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
            try {
              foreach ($parte in $partes) {
                Write-Host "Adicionando $($parte.Name) - $($parte.Length) bytes"
                $entrada = [System.IO.File]::OpenRead($parte.FullName)
                try { $entrada.CopyTo($saida) } finally { $entrada.Dispose() }
              }
            } finally {
              $saida.Dispose()
            }
          }

          $hashFile = 'FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.sha256.txt'
          if (Test-Path -LiteralPath $hashFile) {
            $esperado = ((Get-Content -LiteralPath $hashFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $obtido = (Get-FileHash -LiteralPath $pacote -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($obtido -ne $esperado) {
              throw "Falha de integridade: SHA-256 esperado $esperado, obtido $obtido."
            }
            Write-Host "SHA-256 validado: $obtido"
          }

          $work = Join-Path $env:RUNNER_TEMP 'futbr-desktop-rc1'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -LiteralPath $pacote -DestinationPath $work -Force
          $project = Join-Path $work 'FutBR_Manager_Desktop_RC1'
          $tauriConfig = Join-Path $project 'src-tauri/tauri.conf.json'
          if (-not (Test-Path $tauriConfig)) {
            throw 'Projeto Tauri nao encontrado dentro do ZIP.'
          }

          # Tauri 2 atual usa "currentUser" (nao "perUser") para instalacao sem administrador.
          $cfg = Get-Content -LiteralPath $tauriConfig -Raw
          $cfg = $cfg.Replace('"installMode": "perUser"', '"installMode": "currentUser"')
          Set-Content -LiteralPath $tauriConfig -Value $cfg -Encoding utf8
          Write-Host 'Configuracao NSIS ajustada para installMode=currentUser.'

          # No Windows release, usa o subsistema grafico para nao abrir uma janela de console junto com o jogo.
          $mainRs = Join-Path $project 'src-tauri/src/main.rs'
          $main = [System.IO.File]::ReadAllText($mainRs)
          if ($main -notmatch 'windows_subsystem\s*=\s*"windows"') {
            $main = '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]' + [Environment]::NewLine + $main
            [System.IO.File]::WriteAllText($mainRs, $main, [System.Text.UTF8Encoding]::new($false))
          }
          Write-Host 'Executavel Windows configurado sem console externo.'

          # Desktop RC: comandos nativos para sincronizacao em lote, compra externa e fechar o jogo.
          $libRs = Join-Path $project 'src-tauri/src/lib.rs'
          $lib = [System.IO.File]::ReadAllText($libRs)
          $lib = $lib.Replace('use serde::Serialize;', 'use serde::{Deserialize, Serialize};')
          $lib = $lib.Replace(
            'struct DesktopDb(Mutex<Connection>);',
            'struct DesktopDb(Mutex<Connection>);' + [Environment]::NewLine + [Environment]::NewLine +
            '#[derive(Deserialize)]' + [Environment]::NewLine +
            'struct KvWrite {' + [Environment]::NewLine +
            '    key: String,' + [Environment]::NewLine +
            '    value: serde_json::Value,' + [Environment]::NewLine +
            '}'
          )

          $nativeCommands = @'
#[tauri::command]
fn kv_put_many(entries: Vec<KvWrite>, db: State<'_, DesktopDb>) -> Result<(), String> {
    let mut conn = db.0.lock().map_err(|_| "Banco ocupado".to_string())?;
    let tx = conn.transaction().map_err(|e| e.to_string())?;
    {
        let mut stmt = tx.prepare(
            "INSERT INTO kv(key,value,updated_at) VALUES(?1,?2,unixepoch('now')*1000)
             ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at"
        ).map_err(|e| e.to_string())?;
        for entry in entries {
            let value = serde_json::to_string(&entry.value).map_err(|e| e.to_string())?;
            stmt.execute(params![entry.key, value]).map_err(|e| e.to_string())?;
        }
    }
    tx.commit().map_err(|e| e.to_string())?;
    Ok(())
}

#[tauri::command]
fn open_external_url(url: String) -> Result<(), String> {
    let lower = url.to_ascii_lowercase();
    if !(lower == "https://futbrmanager.com.br"
        || lower.starts_with("https://futbrmanager.com.br/")) {
        return Err("Endereco externo nao permitido.".to_string());
    }
    open::that(url).map_err(|e| e.to_string())?;
    Ok(())
}

#[tauri::command]
fn close_game(app: AppHandle) -> Result<(), String> {
    app.exit(0);
    Ok(())
}

'@
          $lib = $lib.Replace('#[tauri::command]' + [Environment]::NewLine + 'fn desktop_info', $nativeCommands + '#[tauri::command]' + [Environment]::NewLine + 'fn desktop_info')
          $lib = $lib.Replace(
            '            kv_commit_manifest,' + [Environment]::NewLine + '            desktop_info,',
            '            kv_commit_manifest,' + [Environment]::NewLine +
            '            kv_put_many,' + [Environment]::NewLine +
            '            open_external_url,' + [Environment]::NewLine +
            '            close_game,' + [Environment]::NewLine +
            '            desktop_info,'
          )
          [System.IO.File]::WriteAllText($libRs, $lib, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Comandos nativos de performance/compra/fechamento adicionados.'

          # Corrige o frame desktop: algumas sequencias literais "\n" do empacotamento
          # estavam criando text nodes fora do #app e aumentando a altura do body.
          $indexHtml = Join-Path $project 'src/index.html'
          $html = [System.IO.File]::ReadAllText($indexHtml)

          # Performance: IndexedDB volta a ser o armazenamento quente da simulacao.
          # SQLite nativo fica para sincronizacao de saves manuais, evitando IPC/disco em cada rodada.
          $html = $html.Replace('window.FutBRDesktop?.available', 'window.FutBRDesktop?.directStorage')
          $html = $html.Replace('if(!window.FutBRDesktop?.directStorage)return;' + [Environment]::NewLine + ' const baseUpdate', 'if(!window.FutBRDesktop?.available)return;' + [Environment]::NewLine + ' const baseUpdate')
          $html = $html.Replace(' const api={' + [Environment]::NewLine + '  available,', ' const api={' + [Environment]::NewLine + '  available,' + [Environment]::NewLine + '  directStorage:false,')
          $html = $html.Replace(
            '  openDataFolder:()=>call(''open_data_folder'')',
            '  openDataFolder:()=>call(''open_data_folder''),' + [Environment]::NewLine +
            '  writeMany:entries=>call(''kv_put_many'',{entries:entries||[]}),' + [Environment]::NewLine +
            '  openUrl:url=>call(''open_external_url'',{url:String(url)}),' + [Environment]::NewLine +
            '  closeGame:()=>call(''close_game'')'
          )

          # Comercial: preco atual e compra no navegador padrao.
          $html = $html.Replace("const PRICE = 'R$ 24,99';", "const PRICE = 'R$ 19,90';")
          $html = $html.Replace('purchasePriceBRL: 24.99', 'purchasePriceBRL: 19.90')
          $html = $html.Replace('Esta edição grava a carreira no SQLite nativo do computador. F11 alterna a tela cheia.', 'Esta edição usa armazenamento local rápido durante o jogo e sincroniza os saves manuais com o disco. F11 alterna a tela cheia.')
          $html = $html.Replace("icon('clock',12)+' Salvando no disco...'", "icon('clock',12)+' Salvando...'")
          $html = $html.Replace("icon('check',12)+' Disco local &middot; '", "icon('check',12)+' Salvo &middot; '")
          $html = $html.Replace('<body class="">\n<script id="futbr-desktop-native-bridge">', '<body class=""><script id="futbr-desktop-native-bridge">')
          $html = $html.Replace('</script>\n' + [Environment]::NewLine + '<div id="app"', '</script>' + [Environment]::NewLine + '<div id="app"')
          $html = $html.Replace('\n<style id="futbr-desktop-native-style">', '<style id="futbr-desktop-native-style">')
          $html = $html.Replace('</style>\n<script id="futbr-desktop-native-ui">', '</style><script id="futbr-desktop-native-ui">')

          $desktopFrameCss = @'
<style id="futbr-desktop-viewport-lock">
html.futbr-desktop,
html.futbr-desktop body{
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  max-height:100%!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
  overscroll-behavior:none!important;
}
html.futbr-desktop #app{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100dvh!important;
  min-height:0!important;
  max-height:100dvh!important;
  overflow:hidden!important;
}
html.futbr-desktop .main-wrap{
  height:100dvh!important;
  min-height:0!important;
  max-height:100dvh!important;
  overflow:hidden!important;
}
@media(min-width:761px){
  html.futbr-desktop body.v54-competitions-view .main{
    height:calc(100dvh - 66px)!important;
    min-height:calc(100dvh - 66px)!important;
    max-height:calc(100dvh - 66px)!important;
    overflow:hidden!important;
  }
}
</style>
'@
          $html = $html.Replace('</head>', $desktopFrameCss + [Environment]::NewLine + '</head>')
          $desktopPerformanceUi = @'
<style id="futbr-desktop-rc-performance-ui">
html.futbr-desktop .futbr-desktop-close-auth{margin-top:14px;padding-top:12px;border-top:1px solid var(--line,#ffffff22)}
html.futbr-desktop .futbr-desktop-close-auth .btn{width:100%;min-height:34px}
</style>
<script id="futbr-desktop-rc-performance-ui">
(()=>{
 if(!window.FutBRDesktop?.available)return;
 const BASE='gestor_fc_mundo_v205_clean';
 const INDEX=BASE+':futbr125:index';
 const PURCHASE_URL='https://futbrmanager.com.br/#planos';
 let nativeSync=null;

 function localGet(key){
   return openDB().then(db=>new Promise((resolve,reject)=>{
     const r=db.transaction('saves','readonly').objectStore('saves').get(key);
     r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
   }));
 }
 function manifestKeys(m){
   if(!m||m.format!=='GFC_SHARDED_171')return [];
   return Object.values(m.collections||{}).flatMap(spec=>Array.isArray(spec?.keys)?spec.keys:[]);
 }
 async function syncActiveSaveToDisk(){
   if(nativeSync)return nativeSync;
   nativeSync=(async()=>{
     const manifest=await localGet(BASE).catch(()=>null);
     if(!manifest)return false;
     const keys=[INDEX,BASE,BASE+':meta',BASE+':previous',...manifestKeys(manifest)];
     const unique=[...new Set(keys)];
     for(let i=0;i<unique.length;i+=6){
       const entries=[];
       for(const key of unique.slice(i,i+6)){
         const value=await localGet(key).catch(()=>undefined);
         if(value!==undefined)entries.push({key,value});
       }
       if(entries.length)await window.FutBRDesktop.writeMany(entries);
       if(i+6<unique.length)await new Promise(r=>setTimeout(r,0));
     }
     return true;
   })().finally(()=>{nativeSync=null;});
   return nativeSync;
 }
 window.FutBRDesktop.syncActiveSave=syncActiveSaveToDisk;

 // Depois do clique real de salvar, espera o checkpoint local terminar e espelha no SQLite.
 document.addEventListener('click',event=>{
   const action=event.target?.closest?.('[data-action]')?.dataset?.action;
   if(action!=='futbr125-save-current'&&action!=='futbr125-save-and-exit')return;
   setTimeout(async()=>{
     for(let n=0;n<80;n++){
       if(!(typeof busy!=='undefined'&&busy) && !(typeof v52SavePromise!=='undefined'&&v52SavePromise) && !(typeof v52SaveDirty!=='undefined'&&v52SaveDirty))break;
       await new Promise(r=>setTimeout(r,150));
     }
     syncActiveSaveToDisk().catch(e=>console.warn('[FutBR Desktop] espelhamento SQLite:',e));
   },150);
 },true);

 function decorateCloseButton(){
   const card=document.querySelector('.v548-auth .v548-auth-card');
   if(!card||card.querySelector('[data-futbr-desktop-close]'))return;
   card.insertAdjacentHTML('beforeend','<div class="futbr-desktop-close-auth"><button type="button" class="btn ghost" data-futbr-desktop-close="1">Fechar o jogo</button></div>');
 }
 if(typeof v548RenderAuth==='function'){
   const baseRenderAuth=v548RenderAuth;
   v548RenderAuth=function(){const out=baseRenderAuth.apply(this,arguments);queueMicrotask(decorateCloseButton);return out;};
 }
 decorateCloseButton();

 document.addEventListener('click',event=>{
   const close=event.target?.closest?.('[data-futbr-desktop-close]');
   if(close){
     event.preventDefault();event.stopImmediatePropagation();
     Promise.resolve(window.FutBRDesktop.syncActiveSave?.()).catch(()=>{}).finally(()=>window.FutBRDesktop.closeGame());
     return;
   }
   const buy=event.target?.closest?.('[data-futbr-buy-premium]');
   if(buy){
     event.preventDefault();event.stopImmediatePropagation();
     window.FutBRDesktop.openUrl(PURCHASE_URL).catch(()=>alert('Não foi possível abrir o navegador. Acesse https://futbrmanager.com.br/'));
   }
 },true);

 // Sinaliza que o armazenamento quente usa o mesmo caminho rápido da versão HTML.
 document.documentElement.dataset.futbrStorage='indexeddb-hot-sqlite-manual-sync';
})();
</script>
'@
          $html = $html.Replace('</body>', $desktopPerformanceUi + [Environment]::NewLine + '</body>')

          $crestWarmup = @'
<script id="futbr-desktop-crest-warmup">
(()=>{
 if(!window.FutBRDesktop?.available)return;
 const seen=new Set();
 const localSrc=src=>typeof src==='string'&&/^(?:\.\/)?assets\/crests\//.test(src);
 function warm(src,priority='low'){
   if(!localSrc(src)||seen.has(src))return;
   seen.add(src);
   const img=new Image();
   try{img.fetchPriority=priority;}catch(_){}
   img.decoding='async';
   img.src=src;
 }
 function warmVisible(root=document){
   root.querySelectorAll?.('img[src]').forEach(img=>{
     const src=img.getAttribute('src')||'';
     if(localSrc(src)) warm(src,'high');
   });
 }
 function warmTeamIds(ids,priority='high'){
   if(!Array.isArray(ids))return;
   for(const id of ids){
     try{
       const t=(typeof E!=='undefined'&&state)?E.team(state,id):null;
       const url=t?((typeof v4CrestURL==='function'&&v4CrestURL(t))||''):'';
       if(localSrc(url))warm(url,priority);
     }catch(_){}
   }
 }
 function primeCurrentContext(){
   try{
     if(typeof state==='undefined'||!state)return;
     warmTeamIds([state.user],'high');
     const t=typeof E!=='undefined'?E.team(state,state.user):null;
     if(t){
       const league=(state.teams||[]).filter(x=>x&&x.country===t.country&&Number(x.division)===Number(t.division)).map(x=>x.id);
       warmTeamIds(league,'high');
     }
     const next=(state.schedule||[]).slice(Number(state.day)||0,Math.min((Number(state.day)||0)+4,(state.schedule||[]).length));
     warmTeamIds(next.flatMap(d=>(d.fixtures||[]).flatMap(f=>[f.home,f.away])),'high');
   }catch(_){}
 }
 function idleWarmAll(){
   let ids=[];
   try{ids=(state?.teams||[]).map(t=>t.id);}catch(_){}
   let i=0;
   const tick=deadline=>{
     let n=0;
     while(i<ids.length&&n<32&&(deadline?.timeRemaining?.()>3||!deadline)){
       try{
         const t=E.team(state,ids[i++]);
         const url=t?((typeof v4CrestURL==='function'&&v4CrestURL(t))||''):'';
         if(localSrc(url))warm(url,'low');
       }catch(_){i++;}
       n++;
     }
     if(i<ids.length){
       if('requestIdleCallback'in window)requestIdleCallback(tick,{timeout:1500});
       else setTimeout(()=>tick(null),120);
     }
   };
   if('requestIdleCallback'in window)requestIdleCallback(tick,{timeout:1000});
   else setTimeout(()=>tick(null),250);
 }
 const mo=new MutationObserver(list=>{
   for(const m of list)for(const node of m.addedNodes||[])if(node.nodeType===1)warmVisible(node);
 });
 document.addEventListener('DOMContentLoaded',()=>{
   warmVisible(document);
   setTimeout(primeCurrentContext,80);
   setTimeout(idleWarmAll,700);
   mo.observe(document.body,{childList:true,subtree:true});
 },{once:true});
})();
</script>
'@
          $html = $html.Replace('</body>', $crestWarmup + [Environment]::NewLine + '</body>')

          [System.IO.File]::WriteAllText($indexHtml, $html, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Viewport desktop corrigida: sem scroll externo; rolagem permanece nos paineis internos.'

          "FUTBR_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Externalizar escudos para arquivos locais
        shell: pwsh
        run: |
          python .github/scripts/externalize_crests.py "$env:FUTBR_PROJECT"
          $manifest = Join-Path $env:FUTBR_PROJECT 'src/assets/crests/manifest.json'
          if (-not (Test-Path $manifest)) { throw 'Manifesto de escudos locais nao foi gerado.' }
          Get-Content $manifest

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.FUTBR_PROJECT }}/src-tauri -> target

      - name: Instalar Tauri CLI
        shell: pwsh
        working-directory: ${{ env.FUTBR_PROJECT }}
        run: npm install

      - name: Compilar EXE e instalador NSIS
        shell: pwsh
        working-directory: ${{ env.FUTBR_PROJECT }}
        run: npm run tauri build -- --bundles nsis

      - name: Montar pacote portatil e instalador
        shell: pwsh
        working-directory: ${{ env.FUTBR_PROJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path portable | Out-Null

          $exe = 'src-tauri/target/release/futbr-manager.exe'
          if (!(Test-Path $exe)) { throw "EXE nao encontrado: $exe" }

          Copy-Item $exe 'portable/FutBR Manager.exe'
          Set-Content -Path 'portable/portable.flag' -Value 'FutBR Manager portable mode' -Encoding ascii
          Set-Content -Path 'portable/LEIA-ME.txt' -Value @'
          FUTBR MANAGER - DESKTOP RC1 PORTATIL

          Extraia toda a pasta e execute FutBR Manager.exe.
          Nao apague portable.flag.
          Os saves ficam em FutBR Manager Data\saves ao lado do EXE.
          F11 alterna tela cheia. Alt+F4 fecha o jogo.
          '@ -Encoding utf8
          Compress-Archive -Path 'portable/*' -DestinationPath 'artifacts/FutBR-Manager-Desktop-RC1-PORTATIL.zip' -Force

          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName 'artifacts/FutBR-Manager-Desktop-RC1-INSTALADOR.exe' }

          Get-ChildItem artifacts | Format-Table Name,Length

      - name: Entregar builds
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-Desktop-RC1-Windows
          path: ${{ env.FUTBR_PROJECT }}/artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
