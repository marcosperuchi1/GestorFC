name: Publicar FutBR 18.339 assinado no R2 - sem recompilar
on:
  push:
    branches: [feature/desktop-18339-auto-updates]
    paths: ['.github/workflows/publish-signed-update-18339.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: futbr-r2-release-18339
  cancel-in-progress: false
jobs:
  publish:
    name: Validar artefato 18.339 e publicar somente updates/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout dos scripts de publicacao
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar presenca das credenciais do R2 sem mostra-las
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" || { echo "::error::R2_ACCOUNT_ID nao cadastrado em Variables"; exit 1; }
          test -n "$R2_BUCKET" || { echo "::error::R2_BUCKET nao cadastrado em Variables"; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "::error::R2_ACCESS_KEY_ID nao cadastrado em Secrets"; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "::error::R2_SECRET_ACCESS_KEY nao cadastrado em Secrets"; exit 1; }
          test "$R2_BUCKET" = 'futbr-downloads' || { echo "::error::Bucket inesperado: publicar somente em futbr-downloads"; exit 1; }
          echo "GitHub reconheceu as 4 configuracoes do R2."
      - name: Recuperar instalador EXATO aprovado em 16-11-2026
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release/artifacts
          gh run download 43939246673 -n FutBR-Manager-18.339-Windows-Signed-Update -D release/artifacts
          test -s release/artifacts/FutBR-Manager-18.339-Windows.exe
          test -s release/artifacts/FutBR-Manager-18.339-Windows.exe.sig
          test -s release/artifacts/latest.json
          test -s release/artifacts/SHA256SUMS.txt
      - name: Validar SHA256, versao e assinatura antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          d=Path("release/artifacts")
          exe=d/"FutBR-Manager-18.339-Windows.exe"
          signature=(d/"FutBR-Manager-18.339-Windows.exe.sig").read_text(encoding="utf-8").strip()
          manifest=json.loads((d/"latest.json").read_text(encoding="utf-8"))
          expected=(d/"SHA256SUMS.txt").read_text(encoding="ascii").split()[0].lower()
          digest=hashlib.sha256(exe.read_bytes()).hexdigest()
          assert digest==expected, "Installer checksum diverged from verified build"
          assert manifest["version"]=="18.339.0", "Unexpected update release version"
          spec=manifest["platforms"]["windows-x86_64"]
          assert spec["signature"]==signature, "Signature differs from update feed"
          assert spec["url"]=="https://futbrmanager.com.br/updates/FutBR-Manager-18.339-Windows.exe", "Public URL mismatch"
          assert exe.stat().st_size > 20_000_000, "Signed executable abnormally small"
          print("Verified unchanged signed EXE, manifest, signature, and SHA256:",digest)
          PY
      - name: Enviar instalador assinado e latest.json para Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q boto3
          python .github/scripts/publish_signed_update_r2_18339.py release
      - name: Verificar acesso HTTP publico, sem falhar upload privado
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          for url in (
              "https://download.futbrmanager.com.br/updates/latest.json",
              "https://futbrmanager.com.br/updates/latest.json",
          ):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"FutBR-Release-Verification/18.339"}),timeout=15) as r:
                      data=r.read(8192)
                      ctype=r.headers.get("Content-Type","")
                      result=json.loads(data) if "json" in ctype or data.lstrip().startswith(b"{") else {}
                      valid=result.get("version")=="18.339.0" and bool(result.get("platforms",{}).get("windows-x86_64",{}).get("signature"))
                      print("PUBLIC_CHECK",url,"HTTP",r.status,"valid_latest_json",bool(valid),"resolved",r.geturl())
                      if not valid:
                          print("::warning::URL publica ainda nao serve latest.json assinado; configure a regra Cloudflare /updates/*.")
              except Exception as exc:
                  print("PUBLIC_CHECK",url,"unavailable:",type(exc).__name__,str(exc)[:200])
                  print("::warning::Atualizacao publicada no R2, mas o endereco publico precisa de configuracao Cloudflare.")
          PY
