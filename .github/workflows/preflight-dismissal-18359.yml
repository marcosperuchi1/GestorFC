name: Preflight 18.359 real dismissal Worker and job button
on:
  push:
    branches: [fix/desktop-18359-dismissal-control-state]
    paths:
      - '.github/workflows/preflight-dismissal-18359.yml'
      - '.github/scripts/fix_dismissal_control_18359.py'
      - '.github/scripts/test_dismissal_control_18359.py'
      - '.github/scripts/test_dismissal_preflight_18359.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise actual 18.119 vacation completion, UI and click handler
        run: |
          python -m py_compile .github/scripts/fix_dismissal_control_18359.py .github/scripts/test_dismissal_control_18359.py .github/scripts/test_dismissal_preflight_18359.py
          python .github/scripts/test_dismissal_preflight_18359.py
