name: Check FUTBR-WIN tools without admin
on:
  push:
    branches: [fix/desktop-18358-dismissal-button-recovery]
    paths: ['.github/workflows/check-selfhosted-prereqs-18358.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, futbr-windows]
    timeout-minutes: 10
    steps:
      - name: Read-only tools check using cmd (no PowerShell scripts or admin)
        shell: cmd
        run: |
          @echo off
          echo FUTBR-WIN prerequisite inspection - NO ADMIN
          echo Runner: %RUNNER_NAME%
          where python 2>nul || echo PYTHON_NOT_FOUND
          where py 2>nul || echo PY_LAUNCHER_NOT_FOUND
          where node 2>nul || echo NODE_NOT_FOUND
          where npm 2>nul || echo NPM_NOT_FOUND
          where cargo 2>nul || echo CARGO_NOT_FOUND
          where rustc 2>nul || echo RUST_NOT_FOUND
          where cl 2>nul || echo CL_NOT_FOUND_ON_PATH
          where git 2>nul || echo GIT_NOT_FOUND
          where cmake 2>nul || echo CMAKE_NOT_FOUND
          where msbuild 2>nul || echo MSBUILD_NOT_FOUND_ON_PATH
          if exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" (
            echo VSWHERE_FOUND
            "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          ) else (
            echo VSWHERE_NOT_FOUND
          )
          if exist "%ProgramFiles(x86)%\Windows Kits\10\Lib" (echo WINDOWS_SDK_FOUND) else (echo WINDOWS_SDK_NOT_FOUND)
          echo Inspection complete. No installers started.
