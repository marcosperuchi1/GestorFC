name: Inspect FutBR home career mode switch for 18.342
on:
  push:
    branches: [feature/desktop-18341-updater-signature-repair]
    paths: ['.github/workflows/inspect-career-start-18342.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download earlier validated source, not users' careers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/futbr-ui
          gh run download 43906782197 -n FutBR-Windows-18338-Performance-Source -D /tmp/futbr-ui
          test -s /tmp/futbr-ui/src/index.html
      - name: Inspect home screen and mode state handlers
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/futbr-ui/src/index.html').read_text(encoding='utf-8')
          print('SRC_BYTES',len(s))
          terms=['Sua próxima carreira começa aqui','Começar em uma seleção','Começar em um clube','Começar na seleção','Confederação','OVR INICIAL','CAIXA INICIAL','Modelo de desafio financeiro','Nome do treinador','Data-v20','careerStartMode','startMode','selectedNation','selectedClub']
          for term in terms:
              matches=list(re.finditer(re.escape(term),s,re.I))
              print('MATCH',repr(term),'COUNT',len(matches))
              for m in matches[:5]:
                  print('SNIPPET',term,m.start(),repr(s[max(0,m.start()-1300):min(len(s),m.start()+2300)]))
          PY
