          $mirror354 = Get-Content (Join-Path $art 'native-save-mirror-18354-tests.json') -Raw | ConvertFrom-Json
          $archive354 = Get-Content (Join-Path $art 'archive-root-shards-18354-tests.json') -Raw | ConvertFrom-Json
          if (-not $mirror354.ok -or $mirror354.version -ne '18.354.0' -or -not $mirror354.firstCopyOneShardAtTime -or -not $mirror354.incrementalOnlyTwoShards -or -not $mirror354.safeManifestCommitLast -or -not $mirror354.interruptedMirrorKeepsPreviousBackup -or -not $mirror354.validBackupResumedAfterFailure -or -not $archive354.ok -or $archive354.version -ne '18.354.0' -or -not $archive354.allSixRootArchivesSharded -or -not $archive354.legacyRootArchivesStillReadable -or -not $archive354.UIAndWorkerRoundTripAllHistoryTypes -or -not $archive354.noHistoryOrFieldDropped) { throw '18.354: failed 2030+ memory-safe archive and SQLite mirror regression.' }
          if (-not $podium353.ok -or $podium353.version -ne '18.353.0' -or -not $podium353.runnerAndChampRecordedImmediately -or -not $podium353.seasonDoneNotRequired -or -not $podium353.topScorerTiesPreserved -or -not $podium353.singleLegDoesNotAward -or -not $podium353.oldCurrentFinalRecovered -or -not $podium353.legacy2026ScorerFromArchivedYear -or -not $podium353.legacy2027ScorerFromArchivedYear -or -not $podium353.archivedScorersSurviveArchiveEviction -or -not $podium353.missingViceNotInvented -or -not $podium353.verifiedStoredViceRecovered -or -not $podium353.rolloverDoesNotEraseRunnerOrScorers -or -not $podium353.saveFormatUnchanged) { throw '18.353: Serie C final / runner-up / scorers historical regression failed.' }
