name: FutBR Windows 18.359 - authoritative vacation dismissal recovery
on:
  push:
    branches: [fix/desktop-18359-dismissal-control-state]
    paths: ['.github/workflows/build-desktop-updater-18359.yml', '.github/scripts/*18358.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futbr-desktop-18359-signed-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FUTBR_UPDATE_FEED_URL: ${{ vars.FUTBR_UPDATE_FEED_URL }}
      FUTBR_UPDATE_ASSET_BASE_URL: ${{ vars.FUTBR_UPDATE_ASSET_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
