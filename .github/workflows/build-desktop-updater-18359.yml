      - name: Checkout 18.359
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          PSExecutionPolicyPreference: Bypass
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test security and preserve previous game improvements
        shell: pwsh
        run: |
          python -m py_compile .github/scripts/test_dismissal_preflight_18359.py .github/scripts/test_dismissal_control_18359.py .github/scripts/fix_dismissal_control_18359.py .github/scripts/set_desktop_version_18359.py .github/scripts/make_desktop_update_release_18359.py .github/scripts/verify_desktop_updater_signature_18359.py .github/scripts/publish_signed_update_r2_18359.py .github/scripts/test_dismissal_preflight_18358.py .github/scripts/test_dismissal_button_18358.py .github/scripts/fix_dismissal_button_18358.py .github/scripts/set_desktop_version_18358.py .github/scripts/make_desktop_update_release_18358.py .github/scripts/verify_desktop_updater_signature_18358.py .github/scripts/publish_signed_update_r2_18358.py .github/scripts/test_dismissal_preflight_18357.py .github/scripts/test_dismissal_handoff_18357.py .github/scripts/fix_dismissal_handoff_18357.py .github/scripts/set_desktop_version_18357.py .github/scripts/make_desktop_update_release_18357.py .github/scripts/verify_desktop_updater_signature_18357.py .github/scripts/publish_signed_update_r2_18357.py .github/scripts/test_jobwait_preflight_18356.py .github/scripts/test_jobwait_18356.py .github/scripts/fix_jobwait_18356.py .github/scripts/set_desktop_version_18356.py .github/scripts/make_desktop_update_release_18356.py .github/scripts/verify_desktop_updater_signature_18356.py .github/scripts/publish_signed_update_r2_18356.py .github/scripts/test_job_saveexit_patch_18355.py .github/scripts/test_job_saveexit_18355.py .github/scripts/fix_job_saveexit_18355.py .github/scripts/set_desktop_version_18355.py .github/scripts/make_desktop_update_release_18355.py .github/scripts/verify_desktop_updater_signature_18355.py .github/scripts/publish_signed_update_r2_18355.py .github/scripts/harden_native_save_mirror_18354.py .github/scripts/test_native_save_mirror_18354.py .github/scripts/shard_remaining_archives_18354.py .github/scripts/test_archive_root_shards_18354.py .github/scripts/set_desktop_version_18354.py .github/scripts/make_desktop_update_release_18354.py .github/scripts/verify_desktop_updater_signature_18354.py .github/scripts/publish_signed_update_r2_18354.py .github/scripts/fix_seriec_full_history_18353.py .github/scripts/test_seriec_full_history_18353.py .github/scripts/set_desktop_version_18353.py .github/scripts/make_desktop_update_release_18353.py .github/scripts/verify_desktop_updater_signature_18353.py .github/scripts/publish_signed_update_r2_18353.py .github/scripts/optimize_oomsafe_saves_18352.py .github/scripts/test_oomsafe_saves_18352.py .github/scripts/set_desktop_version_18352.py .github/scripts/make_desktop_update_release_18352.py .github/scripts/verify_desktop_updater_signature_18352.py .github/scripts/publish_signed_update_r2_18352.py .github/scripts/fix_seriec_phases_history_18351.py .github/scripts/test_seriec_phases_history_18351.py .github/scripts/set_desktop_version_18351.py .github/scripts/make_desktop_update_release_18351.py .github/scripts/verify_desktop_updater_signature_18351.py .github/scripts/publish_signed_update_r2_18351.py .github/scripts/fix_calendar_match_retirement_18350.py .github/scripts/test_calendar_match_retirement_18350.py .github/scripts/set_desktop_version_18350.py .github/scripts/make_desktop_update_release_18350.py .github/scripts/verify_desktop_updater_signature_18350.py .github/scripts/publish_signed_update_r2_18350.py .github/scripts/fix_career_isolation_18344.py .github/scripts/test_career_isolation_18344.py .github/scripts/set_desktop_version_18344.py .github/scripts/fix_seriec_champion_18345.py .github/scripts/test_seriec_champion_18345.py .github/scripts/set_desktop_version_18345.py .github/scripts/fix_retirement_vacation_18346.py .github/scripts/test_retirement_vacation_18346.py .github/scripts/set_desktop_version_18346.py .github/scripts/feature_calendar_list_18347.py .github/scripts/test_calendar_list_18347.py .github/scripts/set_desktop_version_18348.py .github/scripts/fix_calendar_nav_version_18348.py .github/scripts/test_calendar_nav_version_18348.py .github/scripts/set_desktop_version_18349.py .github/scripts/optimize_incremental_saves_calendar_18349.py .github/scripts/test_incremental_saves_calendar_18349.py .github/scripts/optimize_season_saves_18343.py .github/scripts/test_season_saves_18343.py .github/scripts/fix_welcome_national_preview_18342.py .github/scripts/test_welcome_national_preview_18342.py .github/scripts/verify_desktop_updater_signature_18349.py .github/scripts/set_desktop_version_18349.py .github/scripts/make_desktop_update_release_18350.py .github/scripts/publish_signed_update_r2_18349.py .github/scripts/fix_initial_nationalities_18340.py .github/scripts/test_initial_nationalities_18340.py .github/scripts/fix_scorers_submit_18340.py .github/scripts/test_scorers_submit_18340.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax error in signed update repair.' }
          python .github/scripts/test_dismissal_preflight_18359.py
          if ($LASTEXITCODE -ne 0) { throw '18.359 real Worker-finished dismissal and job-button regression failed.' }
          python .github/scripts/test_dismissal_preflight_18358.py
          if ($LASTEXITCODE -ne 0) { throw '18.358 vacation dismissal UI recovery preflight failed.' }
          python .github/scripts/test_dismissal_preflight_18357.py
          if ($LASTEXITCODE -ne 0) { throw '18.357 dismissal checkpoint and job-wait preflight failed.' }
          python .github/scripts/test_jobwait_preflight_18356.py
          if ($LASTEXITCODE -ne 0) { throw '18.356 job-wait new-season preflight failed.' }
          python .github/scripts/test_job_saveexit_patch_18355.py
          if ($LASTEXITCODE -ne 0) { throw '18.355 fast source-patch and coach-offer regression failed.' }
          python .github/scripts/test_desktop_updater_18339.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy updater behavior regression.' }
          python .github/scripts/test_competition_history_context_18339.py
          if ($LASTEXITCODE -ne 0) { throw 'History regression.' }
      - name: Fail closed unless signing private key is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'The original Tauri signing key is missing; refusing to generate untrusted updates.'
          }
      - name: Rust Windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Derive and lock public key from the original signing private key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'futbr-updater-public-18354.b64'
          cargo run --release --quiet --manifest-path '.github/tools/derive_tauri_pubkey/Cargo.toml' -- $path
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $path)) { throw 'Cannot derive public key from existing private signer.' }
          $pub = (Get-Content $path -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($pub)) { throw 'Derived public key is empty.' }
          "FUTBR_UPDATER_PUBLIC_KEY=$pub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FUTBR_DERIVED_PUBKEY_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Matching Tauri updater public key derived in memory; private key remains secret.'
      - name: Browser regression prerequisites
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Single Windows build - all past fixes plus corrected update trust
        shell: pwsh
        run: .github/scripts/build_desktop_season_18310.ps1
      - name: Package signed candidate for restricted artifact retention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/make_desktop_update_release_18359.py "$env:FUTBR_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Missing signed 18.354 NSIS candidate.' }
          $art = Join-Path $env:FUTBR_PROJECT 'artifacts'
          foreach ($file in @('FutBR-Manager-18.359-Windows.exe','FutBR-Manager-18.359-Windows.exe.sig','latest.json','SHA256SUMS.txt')) {
            if (-not (Test-Path (Join-Path $art $file))) { throw "Missing mandatory signed 18.354 release file: $file" }
          }
          $manifest = Get-Content (Join-Path $art 'latest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne '18.359.0') { throw 'Release manifest does not match the compiled 18.359 Windows version.' }

      - name: Upload restricted installer candidate before independent cryptographic verification
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-18.355-PRIVATE-CANDIDATE-DO-NOT-DISTRIBUTE
          path: |
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-18.359-Windows.exe
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-18.359-Windows.exe.sig
            ${{ env.FUTBR_PROJECT }}/artifacts/latest.json
            ${{ env.FUTBR_PROJECT }}/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
      - name: Cryptographically verify installer and gate publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/verify_desktop_updater_signature_18359.py "$env:FUTBR_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'SECURITY: Public key does not match installer or release signature.' }
          $art = Join-Path $env:FUTBR_PROJECT 'artifacts'
          $installer = Join-Path $art 'FutBR-Manager-18.359-Windows.exe'
          $sig = Join-Path $art 'FutBR-Manager-18.359-Windows.exe.sig'
          cargo run --release --quiet --manifest-path '.github/tools/derive_tauri_pubkey/Cargo.toml' -- verify "$env:FUTBR_DERIVED_PUBKEY_FILE" "$installer" "$sig"
          if ($LASTEXITCODE -ne 0) { throw 'SECURITY: Cryptographic Minisign verification of Windows installer failed.' }
          $nationalities = Get-Content (Join-Path $art 'initial-nationalities-18340-tests.json') -Raw | ConvertFrom-Json
          $search = Get-Content (Join-Path $art 'scorers-submit-18340-tests.json') -Raw | ConvertFrom-Json
          $save = Get-Content (Join-Path $art 'long-career-saves-18338-tests.json') -Raw | ConvertFrom-Json
          $history = Get-Content (Join-Path $art 'champions-retirement-18322-tests.json') -Raw | ConvertFrom-Json
          $version = Get-Content (Join-Path $art 'desktop-version-18359-install.json') -Raw | ConvertFrom-Json
