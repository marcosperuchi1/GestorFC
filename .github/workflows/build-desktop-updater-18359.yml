          if (-not $calendarNav.ok -or $calendarNav.version -ne '18.348.0' -or -not $calendarNav.installedCodeExecuted -or -not $calendarNav.activeSidebarHasCalendar -or -not $calendarNav.calendarJustAfterCompetitions -or -not $calendarNav.calendarClickOpensList -or -not $calendarNav.noDuplicateNavEntry -or -not $calendarNav.welcomeShowsCorrectVersion -or -not $calendarNav.loginShowsCorrectVersion -or -not $calendarNav.visibleSidebarVersionCorrect -or -not $calendarNav.saveStateUnmodified) { throw '18.349: real active calendar menu or installed edition display failed.' }
          if (-not $calendar.ok -or -not $calendar.realHTMLFeatureExecuted -or -not $calendar.compactListLayout -or -not $calendar.realCrests -or -not $calendar.next10Default -or -not $calendar.opponentProfileAvailable -or -not $calendar.retirementPageRemoved -or -not $calendar.savedRetirementHistoryUntouched) { throw 'CALENDAR 18.349: list, crests, opponent details and retirement UI regression failed.' }
