name: Validate FutBR 18.385 rapid online login and device security
on:
  workflow_dispatch:
  push:
    branches: [fix/desktop-18385-fast-secure-login]
    paths: [.github/workflows/preflight-18385.yml, '.github/scripts/*18385.py', '.github/scripts/*18385.ps1']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify supplied national flag image bytes are complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,struct,zlib
          flags={}
          for file in sorted(Path('.github/scripts').glob('flags_18383_*.b64')):
           for line in file.read_text().splitlines():
            if not line.strip():continue
            code,raw=line.split(' ',1)
            data=base64.b64decode(raw,validate=True)
            assert data.startswith(b'\x89PNG\r\n\x1a\n'),code
            at=8;ids=[];found=False
            while at<len(data):
             n=struct.unpack('>I',data[at:at+4])[0]
             name=data[at+4:at+8];part=data[at+8:at+8+n]
             crc=struct.unpack('>I',data[at+8+n:at+12+n])[0]
             assert zlib.crc32(name+part)&0xffffffff==crc,(code,name)
             if name==b'IDAT':ids.append(part)
             if name==b'IEND':found=True
             at+=12+n
            assert found and at==len(data),(code,'incomplete file')
            assert len(zlib.decompress(b''.join(ids)))>100,code
            flags[code]=len(data)
          assert set(flags)=={'SAM','FIJ','SOL','SGP','HKG','PNG','VUT','TAH','NCL'},flags
          print('9 uploaded flags verified as intact PNGs:',flags)
          PY
      - name: Restore approved complete game and its original Tauri ACL
        shell: bash
        run: |
          mkdir -p /tmp/art /tmp/game/src /tmp/game/src-tauri/capabilities
          gh run download 44968669984 -R marcosperuchi1/GestorFC \
           -n FutBR-18.374-Career-Club-Season-Real-Engine-44968669984 -D /tmp/art
          src=$(find /tmp/art -name 'prepared-source-18374.html.gz'|head -1)
          test -n "$src"
          gzip -dc "$src" > /tmp/game/src/index.html
          cat FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part* > /tmp/base.zip
          python - <<'PY'
          import zipfile,base64,json,os
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/base.zip')
          Path('/tmp/game/src-tauri/capabilities/default.json').write_bytes(z.read('FutBR_Manager_Desktop_RC1/src-tauri/capabilities/default.json'))
          raw=b'Ed'+bytes(range(8))+bytes(range(32))
          key=base64.b64encode(b'untrusted comment: synthetic testing only\n'+base64.b64encode(raw)+b'\n').decode()
          cfg={'version':'18.374.0','bundle':{'createUpdaterArtifacts':True},'plugins':{'updater':{'pubkey':key,'endpoints':['https://download.futbrmanager.com.br/updates/latest.json']}}}
          Path('/tmp/game/src-tauri/tauri.conf.json').write_text(json.dumps(cfg))
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('FUTBR_UPDATER_PUBLIC_KEY='+key+'\n')
          PY
      - name: Apply and validate the already-approved 18.375 and 18.376 fixes
        shell: bash
        run: |
          python -m pip -q install playwright
          python -m playwright install chromium
          python .github/scripts/fix_calendar_translations_18375.py /tmp/game
          python .github/scripts/fix_transfer_realism_18375.py /tmp/game
          python .github/scripts/improve_support_ui_18375.py /tmp/game
          python .github/scripts/set_desktop_version_18375.py /tmp/game
          python .github/scripts/validate_support_release_18375.py /tmp/game
          python .github/scripts/fix_font_settings_18376.py /tmp/game
          python .github/scripts/test_font_settings_18376.py /tmp/game
          python .github/scripts/set_desktop_version_18376.py /tmp/game
          python .github/scripts/validate_font_settings_release_18376.py /tmp/game
      - name: Test 2026 historical leaderboard, Tauri ACL and final signed app version
        shell: bash
        run: |
          python .github/scripts/fix_legacy_scorers_18377.py /tmp/game
          python .github/scripts/fix_window_capture_18377.py /tmp/game
          python .github/scripts/test_historical_scorers_18377.py /tmp/game
          python .github/scripts/set_desktop_version_18377.py /tmp/game
          python .github/scripts/validate_history_window_release_18377.py /tmp/game
          python .github/scripts/fix_money_autoupdate_18378.py /tmp/game
          python .github/scripts/set_desktop_version_18378.py /tmp/game
          python .github/scripts/validate_money_autoupdate_release_18378.py /tmp/game
          python .github/scripts/test_money_autoupdate_runtime_18378.py /tmp/game
          python .github/scripts/fix_scorer_identity_18379.py /tmp/game
          python .github/scripts/test_scorer_identity_18379.py /tmp/game
          python .github/scripts/set_desktop_version_18379.py /tmp/game
          python .github/scripts/validate_scorer_identity_release_18379.py /tmp/game
          python .github/scripts/fix_coach_honors_inline_scorers_18380.py /tmp/game
          python .github/scripts/test_coach_honors_inline_scorers_18380.py /tmp/game
          # Regression isolation: legacy scorer harness must also work after 18.380 is injected.
          python .github/scripts/test_scorer_identity_18379.py /tmp/game
          python .github/scripts/set_desktop_version_18380.py /tmp/game
          python .github/scripts/validate_coach_honors_inline_release_18380.py /tmp/game
          python .github/scripts/fix_national_history_competition_filter_18381.py /tmp/game
          python .github/scripts/test_national_history_competition_filter_18381.py /tmp/game
          # Regression check: same selection name must return every historical year, even with different edition IDs.
          python .github/scripts/set_desktop_version_18381.py /tmp/game
          python .github/scripts/validate_national_history_filter_release_18381.py /tmp/game
          python .github/scripts/optimize_career_sync_load_18382.py /tmp/game
          python .github/scripts/test_career_sync_load_18382.py /tmp/game
          python .github/scripts/set_desktop_version_18382.py /tmp/game
          python .github/scripts/validate_career_sync_load_release_18382.py /tmp/game
          python .github/scripts/apply_flags_coaches_stars_aging_18383.py /tmp/game
          python .github/scripts/test_flags_coaches_stars_aging_18383.py /tmp/game
          python .github/scripts/set_desktop_version_18383.py /tmp/game
          python .github/scripts/validate_career_realism_release_18383.py /tmp/game
          python .github/scripts/fix_season_scope_18384.py /tmp/game
          python .github/scripts/balance_ai_rosters_18384.py /tmp/game
          python .github/scripts/group_player_honors_18384.py /tmp/game
          python .github/scripts/test_season_scope_18384.py /tmp/game
          python .github/scripts/test_roster_balance_18384.py /tmp/game
          python .github/scripts/test_player_honors_18384.py /tmp/game
          python .github/scripts/set_desktop_version_18384.py /tmp/game
          python .github/scripts/validate_season_roster_honors_release_18384.py /tmp/game
          python .github/scripts/apply_fast_auth_18385.py /tmp/game
          python .github/scripts/test_fast_auth_18385.py /tmp/game
          python .github/scripts/set_desktop_version_18385.py /tmp/game
          python .github/scripts/validate_fast_secure_login_release_18385.py /tmp/game
          # Repeat the legacy coach UI regression on the final combined 18.384
          # source to catch accidental inclusion of newer player honor wrappers.
          python .github/scripts/test_coach_honors_inline_scorers_18380.py /tmp/game
      - uses: actions/upload-artifact@v4
        with:
          name: FutBR-18.385-Fast-Secure-Login-Preflight
          path: |
            /tmp/game/history-window-release-18377-tests.json
            /tmp/game/historical-scorers-18377-tests.json
            /tmp/game/window-capture-18377-install.json
            /tmp/game/money-autoupdate-18378-tests.json
            /tmp/game/money-autoupdate-release-18378-tests.json
            /tmp/game/money-autoupdate-runtime-18378-tests.json
            /tmp/game/scorer-identity-18379-tests.json
            /tmp/game/scorer-identity-18379-install.json
            /tmp/game/scorer-identity-release-18379-tests.json
            /tmp/game/coach-honors-inline-18380-install.json
            /tmp/game/coach-honors-inline-18380-tests.json
            /tmp/game/coach-honors-inline-release-18380-tests.json
            /tmp/game/national-history-filter-18381-install.json
            /tmp/game/national-history-filter-18381-tests.json
            /tmp/game/national-history-filter-release-18381-tests.json
            /tmp/game/career-sync-load-18382-install.json
            /tmp/game/career-sync-load-18382-tests.json
            /tmp/game/career-sync-load-release-18382-tests.json
            /tmp/game/career-realism-18383-install.json
            /tmp/game/career-realism-18383-tests.json
            /tmp/game/career-realism-release-18383-tests.json
            /tmp/game/season-scope-18384-install.json
            /tmp/game/season-scope-18384-tests.json
            /tmp/game/roster-balance-18384-install.json
            /tmp/game/roster-balance-18384-tests.json
            /tmp/game/player-honors-18384-install.json
            /tmp/game/player-honors-18384-tests.json
            /tmp/game/season-roster-honors-release-18384-tests.json
            /tmp/game/fast-secure-login-18385-install.json
            /tmp/game/fast-secure-login-18385-tests.json
            /tmp/game/fast-secure-login-release-18385-tests.json
          retention-days: 14
