name: Exportar instalador mais recente

on:
  push:
    paths:
      - '.github/workflows/export-latest-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    name: Publicar instalador da build-latest
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch build-latest
        uses: actions/checkout@v4
        with:
          ref: build-latest
          fetch-depth: 1

      - name: Conferir instalador
        shell: bash
        run: |
          test -f FutBR-Manager-Desktop-RC1-INSTALADOR.exe
          ls -lh FutBR-Manager-Desktop-RC1-INSTALADOR.exe
          sha256sum FutBR-Manager-Desktop-RC1-INSTALADOR.exe

      - name: Publicar instalador na versão de teste
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='teste-ranking-18.301'
          FILE='FutBR-Manager-Desktop-RC1-INSTALADOR.exe'

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target build-latest \
              --title 'FutBR Manager 18.301 - Teste' \
              --notes 'Build de teste 18.301 com o ranking incremental e as correções mais recentes. Não publicar aos jogadores antes da validação.' \
              --prerelease
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url
