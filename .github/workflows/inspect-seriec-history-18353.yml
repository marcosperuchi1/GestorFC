name: Diagnose Serie C scorer and final persistence 18.353
on:
  push:
    branches: [fix/desktop-18353-seriec-full-podium-live-history]
    paths: ['.github/workflows/inspect-seriec-history-18353.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect underlying real 18.352 game and scorer archive layout
        run: |
          python3 - <<'PY'
          import zipfile,re
          from pathlib import Path
          with open('/tmp/futbr-source.zip','wb') as dst:
           for p in sorted(Path('.').glob('FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*')):
            with p.open('rb') as f:
             while chunk:=f.read(1<<20):dst.write(chunk)
          with zipfile.ZipFile('/tmp/futbr-source.zip') as z:
           html=z.read(next(x for x in z.namelist() if x.endswith('/src/index.html'))).decode('utf8')
          targets=[
            'function v661RecordBrazilResult(s','function v661RecordBrazilResult(',
            'function v661PreparePlan(','function v99RepairBrazilLowerChampions(s)',
            'function v94CompactScorerArchive(', 'function v94PackCurrentCareerArchive(',
            'function v94ChampionInfo()', 'function v661C','function v661Ensure',
            'function v661Order(', 'function v661TieWinner(',
            'function v98Record','function v98','function v94Compact',
            'function v540RawTable','function v99TieWinner(',
            'function v94Pack','function v94','function v52',
            'function v18322','function v91','function v735'
          ]
          for target in targets:
           hits=list(re.finditer(re.escape(target),html))
           if len(hits)>8 and target in ('function v94','function v52','function v18322','function v91','function v735'):hits=hits[:8]
           print('=====',target,len(hits))
           for m in hits[:3]:
            print(html[m.start():m.start()+(5400 if target.startswith('function v661Record') or target.startswith('function v94Compact') else 3300)])
          for word in ['scorerArchive','v98LeagueTitleHistory','v94CompactScorerArchive','competitionStats','v18322CaptureSeason','v99RepairBrazilLowerChampions','v661RecordBrazilResult','braLowerLast','v735NationalArchive']:
           matches=list(re.finditer(word,html))
           print('MATCHES',word,len(matches))
           for m in matches[-12:]:
            print('CTX',html[max(0,m.start()-180):m.start()+340].replace('\n',' '))
          PY
