name: Diagnose 18.201 stale scorers observer scope
on:
  push:
    branches: [fix/desktop-18366-root-scope-handoff]
    paths: ['.github/workflows/diagnose-vacation-handoff-18364.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Locate legacy 18.201 recovery observer and surrounding script boundaries
        run: |
          python - <<'PY'
          import pathlib,zipfile,io,re
          parts=sorted(pathlib.Path('.').glob('FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*'))
          with zipfile.ZipFile(io.BytesIO(b''.join(p.read_bytes() for p in parts))) as z:
            s=z.read(next(n for n in z.namelist() if n.endswith('/src/index.html'))).decode('utf-8-sig')
          for name in ('v18201RecoverNotice','v18201Decorate','futbr-scorers','18201','18.201'):
            ps=[m.start() for m in re.finditer(re.escape(name),s)]
            print('\nTERM',name,'MATCHES',len(ps),flush=True)
            for p in ps[:12]:
              pre=s.rfind('<script',0,p);close=s.find('</script>',p)
              print('AT',p,'SCRIPT_OPEN',pre,'OPEN TAG',s[pre:pre+180],
                    'CLOSE',close,'TEXT',s[max(0,p-550):p+2100],flush=True)
          PY
