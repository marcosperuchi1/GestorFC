name: Diagnose 18.365 state scope and real vacation button
on:
  push:
    branches: [fix/desktop-18366-root-scope-handoff]
    paths: ['.github/workflows/diagnose-vacation-handoff-18364.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original HTML state lexical boundary and callable exports
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,zipfile,io,re
          parts=sorted(pathlib.Path('.').glob('FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*'))
          with zipfile.ZipFile(io.BytesIO(b''.join(p.read_bytes() for p in parts))) as z:
            s=z.read(next(n for n in z.namelist() if n.endswith('/src/index.html'))).decode('utf-8-sig')
          print('SOURCE LEN',len(s),flush=True)
          starts=[m.start() for m in re.finditer(r'<script\b',s,re.I)]
          ends=[m.start() for m in re.finditer(r'</script>',s,re.I)]
          print('SCRIPTS',len(starts),len(ends),'FIRST',starts[:8],'LAST',starts[-12:],flush=True)
          for label,pat,maxcount,left,right in [
            ('state declarations',r'\b(?:let|var|const)\s+state\s*[=,;]',8,1300,1100),
            ('main act declarations',r'(?:function act\(|\blet act\s*=|\bact=function)',8,400,800),
            ('v53 simulator state',r'const v53Sim=',3,500,400),
            ('first IIFE on script start',r'\(\(\)\s*=>\s*\{',3,120,300),
            ('export references',r'(?:window.GestorFC.state|GestorFC.state|\.getState\(|GFC\s*=)',10,250,500),
            ('login auth setup',r'let v548Session|const v548Session|function v548EnterGame',6,500,600),
            ('last script fragment',r'const EDITION=',5,150,550)
          ]:
            found=[m.start() for m in re.finditer(pat,s,re.I)]
            print('\nLABEL',label,'COUNT',len(found),flush=True)
            for p in found[:maxcount]:
              ix=max([i for i,a in enumerate(starts) if a<p],default=-1)
              e=ends[ix] if ix>=0 and ix<len(ends) else None
              print('AT',p,'SCRIPT',ix,'SCRIPTSTART',starts[ix] if ix>=0 else None,
                    'SCRIPTEND',e,'AFTEREND',bool(e is not None and p>e),
                    'CONTEXT',s[max(0,p-left):p+right],flush=True)
          print('FIRST SCRIPTS HEADERS', [(i,s[a:a+100]) for i,a in enumerate(starts[:6])],flush=True)
          state_index=s.index('let state=null,saved=null')
          script_close=s.find('</script>',state_index)
          print('PRIMARY SCRIPT CLOSE AT',script_close,'DISTANCE',script_close-state_index,flush=True)
          print('PRIMARY SCRIPT TAIL',s[script_close-3600:script_close+200],flush=True)
          for tag in ('futbr-jobwait-state-18363','futbr-vacation-handoff-18364','futbr-dismissal-source-18365'):
            print('CONTAINER TAG',tag,'FROM ORIGINAL',s.find(tag),flush=True)
          print('LAST 2500',s[-2500:],flush=True)
          PY
