name: Build desempenho de ferias 18.310
on:
  workflow_run:
    workflows: ['Validar sincronizacao e temporadas 18.310']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: futbr-season-build-18310
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Obter a revisao validada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Preparar navegador de testes
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar testes.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar navegador.' }
      - name: Testar e compilar instalador Windows
        shell: pwsh
        run: .github/scripts/build_desktop_season_18310.ps1
      - name: Gerar SHA256 do instalador
        shell: pwsh
        run: |
          $dir = Join-Path $env:FUTBR_PROJECT 'artifacts'
          $installer = Join-Path $dir 'FutBR-Manager-Desktop-RC1-INSTALADOR.exe'
          if (-not (Test-Path $installer)) { throw 'Instalador nao encontrado.' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FutBR-Manager-Desktop-RC1-INSTALADOR.exe" | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
      - name: Preparar hash do instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:FUTBR_PROJECT 'artifacts'
          $installer = Join-Path $dir 'FutBR-Manager-Desktop-RC1-INSTALADOR.exe'
          if (-not (Test-Path $installer)) { throw 'Instalador nao encontrado.' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FutBR-Manager-Desktop-RC1-INSTALADOR.exe" | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "Instalador SHA256: $hash"
      - name: Disponibilizar instalador para teste
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-18.318-Windows
          path: |
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-Desktop-RC1-INSTALADOR.exe
            ${{ env.FUTBR_PROJECT }}/artifacts/SHA256SUMS.txt
            ${{ env.FUTBR_PROJECT }}/artifacts/season-sync-18310-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/season-sync-18310-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/new-season-vacation-18311-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/new-season-vacation-18311-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/rankings-finals-18312-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/rankings-finals-18312-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/runtime-18313-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/runtime-18313-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/ranking-cache-18314-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/ranking-cache-18314-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/sparse-titles-18315-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/sparse-titles-18315-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/rank-rollover-18316-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/rank-rollover-18316-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/title-engine-18317-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/title-engine-18317-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/ranking-rebuild-18318-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/ranking-rebuild-18318-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/create-performance-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/architecture-validation.json
          if-no-files-found: error
          retention-days: 7
