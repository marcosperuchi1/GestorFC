name: Build unico Ranking incremental 18.301

on:
  pull_request_target:
    branches: [main]
    paths:
      - '.github/build-trigger-18300.txt'

permissions:
  contents: write

concurrency:
  group: futbr-ranking-incremental-18301-once
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e publicar Ranking incremental 18.301
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Baixar branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Preparar navegador de testes
        shell: pwsh
        run: python -m pip install playwright

      - name: Compilar e testar pacote completo
        shell: pwsh
        run: .github/scripts/build_desktop_root.ps1

      - name: Substituir branch build-latest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dist = Join-Path $env:RUNNER_TEMP 'futbr-distribution-18301'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "$env:FUTBR_PROJECT/artifacts/FutBR-Manager-Desktop-RC1-INSTALADOR.exe" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/FutBR-Manager-Desktop-RC1-PORTATIL.zip" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/mls-vacation-tests.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/scorers-in-scope-tests.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/rankings-18230-install.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/rankings-18230-stability.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/rankings-18230-tests.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/incremental-ranking-18300-install.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/incremental-ranking-18301-install.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/incremental-ranking-18300-tests.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/create-performance-tests.json" $dist
          Copy-Item "$env:FUTBR_PROJECT/artifacts/architecture-validation.json" $dist

          $readme = @(
            '# FutBR Manager - ultimo build de teste',
            '',
            "Build Ranking incremental 18.301 · workflow #${{ github.run_number }}.",
            '',
            '- `FutBR-Manager-Desktop-RC1-INSTALADOR.exe`: instalador Windows.',
            '- `FutBR-Manager-Desktop-RC1-PORTATIL.zip`: versao portatil.',
            '- O aviso incorreto de salvamento web foi removido do executavel desktop.',
            '- Mensagens tecnicas com tempo da virada de temporada nao sao exibidas ao usuario.',
            '- O Ranking de Clubes passa a manter uma base persistente dentro do save.',
            '- A primeira migracao calcula a base uma vez; depois somente clubes de competicoes afetadas e novos campeoes sao atualizados.',
            '- J/V/E/D sao mantidos incrementalmente a cada novo resultado.',
            '- A virada de temporada reutiliza a classificacao existente e nao reconstrói os 5.628 clubes.',
            '- A metodologia original de pontuacao 6.33 foi preservada.',
            '- As otimizacoes de base externa, saves fragmentados, SQLite e memoria de carreira longa permanecem ativas.',
            '',
            'Esta branch e substituida integralmente a cada novo build aprovado.'
          )
          Set-Content (Join-Path $dist 'README.md') $readme -Encoding utf8

          Set-Location $env:GITHUB_WORKSPACE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan build-latest
          git rm -rf . 2>$null
          git clean -fdx
          Copy-Item "$dist/*" . -Force
          git add .
          git commit -m "FutBR Manager Ranking incremental 18.301 build #${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar commit do build-latest.' }
          git push --force origin HEAD:build-latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a branch build-latest.' }

          Write-Host 'Build 18.301 publicado na branch build-latest sem usar Actions artifacts.'
