name: Disparar build desktop temporariamente

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar workflow principal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "/repos/$GITHUB_REPOSITORY/actions/workflows/build-desktop-rc1-clean.yml/dispatches" -f ref=main
