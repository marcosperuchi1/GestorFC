name: FutBR Windows 18.341 - reparo definitivo da assinatura automatica
on:
  push:
    branches: [feature/desktop-18341-updater-signature-repair]
    paths: ['.github/workflows/build-desktop-updater-18341.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futbr-desktop-18341-signed-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FUTBR_UPDATE_FEED_URL: ${{ vars.FUTBR_UPDATE_FEED_URL }}
      FUTBR_UPDATE_ASSET_BASE_URL: ${{ vars.FUTBR_UPDATE_ASSET_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout 18.341
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test security and preserve previous game improvements
        shell: pwsh
        run: |
          python -m py_compile .github/scripts/verify_desktop_updater_signature_18341.py .github/scripts/set_desktop_version_18341.py .github/scripts/make_desktop_update_release_18341.py .github/scripts/publish_signed_update_r2_18341.py .github/scripts/fix_initial_nationalities_18340.py .github/scripts/test_initial_nationalities_18340.py .github/scripts/fix_scorers_submit_18340.py .github/scripts/test_scorers_submit_18340.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax error in signed update repair.' }
          python .github/scripts/test_desktop_updater_18339.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy updater behavior regression.' }
          python .github/scripts/test_competition_history_context_18339.py
          if ($LASTEXITCODE -ne 0) { throw 'History regression.' }
      - name: Fail closed unless signing private key is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'The original Tauri signing key is missing; refusing to generate untrusted updates.'
          }
      - name: Rust Windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Derive and lock public key from the original signing private key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'futbr-updater-public-18341.b64'
          cargo run --release --quiet --manifest-path '.github/tools/derive_tauri_pubkey/Cargo.toml' -- $path
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $path)) { throw 'Cannot derive public key from existing private signer.' }
          $pub = (Get-Content $path -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($pub)) { throw 'Derived public key is empty.' }
          "FUTBR_UPDATER_PUBLIC_KEY=$pub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FUTBR_DERIVED_PUBKEY_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Matching Tauri updater public key derived in memory; private key remains secret.'
      - name: Browser regression prerequisites
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Single Windows build - all past fixes plus corrected update trust
        shell: pwsh
        run: .github/scripts/build_desktop_season_18310.ps1
      - name: Cryptographically verify installer and gate publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/make_desktop_update_release_18341.py "$env:FUTBR_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'Missing 18.341 signed NSIS output.' }
          python .github/scripts/verify_desktop_updater_signature_18341.py "$env:FUTBR_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw 'SECURITY: Public key does not match installer or release signature.' }
          $art = Join-Path $env:FUTBR_PROJECT 'artifacts'
          $installer = Join-Path $art 'FutBR-Manager-18.341-Windows.exe'
          $sig = Join-Path $art 'FutBR-Manager-18.341-Windows.exe.sig'
          cargo run --release --quiet --manifest-path '.github/tools/derive_tauri_pubkey/Cargo.toml' -- verify "$env:FUTBR_DERIVED_PUBKEY_FILE" "$installer" "$sig"
          if ($LASTEXITCODE -ne 0) { throw 'SECURITY: Cryptographic Minisign verification of Windows installer failed.' }
          $nationalities = Get-Content (Join-Path $art 'initial-nationalities-18340-tests.json') -Raw | ConvertFrom-Json
          $search = Get-Content (Join-Path $art 'scorers-submit-18340-tests.json') -Raw | ConvertFrom-Json
          $save = Get-Content (Join-Path $art 'long-career-saves-18338-tests.json') -Raw | ConvertFrom-Json
          $history = Get-Content (Join-Path $art 'champions-retirement-18322-tests.json') -Raw | ConvertFrom-Json
          $version = Get-Content (Join-Path $art 'desktop-version-18341-install.json') -Raw | ConvertFrom-Json
          if (-not $nationalities.ok -or $nationalities.firminoNatCode -ne 'BRA' -or $nationalities.coachNatCode -ne 'USA' -or -not $search.ok -or -not $search.scorers.searchByButton -or -not $search.scorers.searchByEnter -or $search.scorers.searchDuringTyping -or -not $save.ok -or -not $history.ok -or $version.version -ne '18.341.0') {
            throw 'Game data, search or historical career test failed.'
          }
          Write-Host 'PASS: genuine signed updater, BRA/USA initial data, scorers and career regression checks.'
      - name: Upload verified signed installer and integrity reports
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-18.341-Windows-Signed-Updater-Repair
          path: |
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-18.341-Windows.exe
            ${{ env.FUTBR_PROJECT }}/artifacts/FutBR-Manager-18.341-Windows.exe.sig
            ${{ env.FUTBR_PROJECT }}/artifacts/latest.json
            ${{ env.FUTBR_PROJECT }}/artifacts/SHA256SUMS.txt
            ${{ env.FUTBR_PROJECT }}/artifacts/updater-18341-signature-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/desktop-version-18341-install.json
            ${{ env.FUTBR_PROJECT }}/artifacts/desktop-update-release-18341.json
            ${{ env.FUTBR_PROJECT }}/artifacts/initial-nationalities-18340-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/scorers-submit-18340-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/long-career-saves-18338-tests.json
            ${{ env.FUTBR_PROJECT }}/artifacts/champions-retirement-18322-tests.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish signed 18.341 after complete verification only
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:R2_ACCOUNT_ID) -or [string]::IsNullOrWhiteSpace($env:R2_BUCKET) -or [string]::IsNullOrWhiteSpace($env:R2_ACCESS_KEY_ID) -or [string]::IsNullOrWhiteSpace($env:R2_SECRET_ACCESS_KEY)) {
            Write-Host '::notice::R2 credentials unavailable. Signed installer remains available from GitHub artifact.'
          } else {
            python -m pip install boto3
            if ($LASTEXITCODE -ne 0) { throw 'boto3 installation failed' }
            python .github/scripts/publish_signed_update_r2_18341.py "$env:FUTBR_PROJECT"
            if ($LASTEXITCODE -ne 0) { throw 'Publication failed. 18.341 manifest was not updated.' }
          }
# 18.341 is the first version containing a cryptographically matched updater trust key.
# Pre-18.341 installs require one manual upgrade; do not disable signature verification.
