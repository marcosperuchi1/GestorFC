name: Limpar caches antigos do Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-caches-temp.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Excluir todos os caches do repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[].id' > /tmp/cache_ids.txt
          count=0
          while read -r id; do
            [ -z "${id:-}" ] && continue
            echo "Excluindo cache $id"
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/caches/$id"
            count=$((count+1))
          done < /tmp/cache_ids.txt
          echo "Caches excluidos: $count"
          remaining=$(gh api "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=1" --jq '.total_count')
          echo "Caches restantes: $remaining"
          test "$remaining" -eq 0
