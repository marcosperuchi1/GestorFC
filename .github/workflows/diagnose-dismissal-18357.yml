name: Diagnose 18.357 dismissal handoff and checkpoint transitions
on:
  push:
    branches: [fix/desktop-18357-dismissal-handoff]
    paths: ['.github/workflows/diagnose-dismissal-18357.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only the original shipped game's critical dismissal transitions
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,zipfile,io,re
          parts=sorted(pathlib.Path('.').glob('FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*'))
          with zipfile.ZipFile(io.BytesIO(b''.join(p.read_bytes() for p in parts))) as z:
              path=next(n for n in z.namelist() if n.endswith('/src/index.html'))
              src=z.read(path).decode('utf-8-sig')
          print('SRC',len(src),flush=True)
          for term in ["G.v170?._afterWorkerSave","G.v170._afterWorkerSave","v93Promote","v93CommitVacation","v93RestoreVacation","v171SaveScope","v53Sim.syncing=false;try{v53PaintStatus","async function v93"]:
              positions=[m.start() for m in re.finditer(re.escape(term),src)]
              print('HIGHLIGHT',repr(term),'matches',len(positions),flush=True)
              for i in positions[:3]:
                  print(src[max(0,i-2400):i+1350],flush=True)
          for term,span,maxn in [
            ('const baseAfter=G.v170',4500,3),
            ('G.v170._afterWorkerSave=',5400,3),
            ('_afterWorkerSave=function',5400,4),
            ('v171PromoteVacationCheckpoint',2500,4),
            ('async function v171',2300,5),
            ('v53Sim.syncing=true',1800,6),
            ('m.kind===\'finished\'',4900,3),
            ('m.kind===\'vac-sync-end\'',2400,4),
            ('function v93PromoteVacationCheckpoint',3700,3),
            ('v93PromoteVacationCheckpoint(',2800,4),
            ('async function rawRead(',1600,3),
            ('const v18112BaseSimulation=v53StartSimulation;',3200,2),
          ]:
             pos=[m.start() for m in re.finditer(re.escape(term),src)]
             print('FOCUS',repr(term),'COUNT',len(pos),flush=True)
             for i in pos[-maxn:]:
                 print('<<<',term,i,'>>>',flush=True)
                 print(src[max(0,i-400):i+span],flush=True)
          for term,span,maxn in [
            ('v18112MarkDismissal(',850,6),
            ('v18112Dismissal.pending=',360,8),
            ('v18112Dismissal.ready=',360,8),
            ('v53Sim.syncing=false',650,15),
            ('v53Sim.patching=false',650,15),
            ('v53Sim.active=false',650,15),
            ('v53Sim.finished=null',750,12),
            ('v18117SyncSeq',350,5),
            ("kind==='vac-sync-end'",2200,3),
            ("'vac-sync-end'",850,8),
            ("'vac-sync-start'",850,8),
            ("'vac-sync-collection'",650,8),
            ('storageAudit:',2000,5),
            ('v171StorageAudit',2000,6),
            ('v171.storageAudit',750,10),
            ('async function v52FlushSave(',1200,2),
            ('function v53Handle',1300,3),
            ('v53Sim.finished?.resolve',1000,5),
            ('v53Sim.finished?.reject',850,5)
          ]:
             positions=[m.start() for m in re.finditer(re.escape(term),src)]
             print('\nSEARCH',repr(term),'COUNT',len(positions),flush=True)
             for i in positions[:maxn]:
                 print('\n<<<',term,'POSITION',i,'>>>',flush=True)
                 print(src[max(0,i-250):i+span],flush=True)
          PY