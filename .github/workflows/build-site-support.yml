name: Build updated FutBR website (support and legal)
on:
  push:
    branches: [site/support-center-20261117]
    paths:
      - 'site-support/build_site.py'
      - 'site-support/suporte.html'
      - '.github/workflows/build-site-support.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all website files from existing public site
        run: python site-support/build_site.py
      - name: Verify structure, source files, JavaScript and ZIP integrity
        run: |
          set -e
          node --check site-support/dist/deploy/app.js
          node --check site-support/dist/deploy/config.js
          node --check site-support/dist/deploy/homologacao.js
          unzip -t site-support/dist/FutBR_Manager_SITE_Com_Suporte_Termos_Privacidade.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root=Path('site-support/dist/deploy')
          needed={
              'index.html','suporte.html','app.js','config.js','styles.css',
              'homologacao.html','homologacao.js','assets/futbr-logo.png'
          }
          actual={str(p.relative_to(root)).replace('\\','/') for p in root.rglob('*') if p.is_file()}
          assert actual==needed, (actual,needed)
          assert (root/'index.html').read_text(encoding='utf-8').lower().startswith('<!doctype html')
          assert 'Documento preliminar' not in (root/'app.js').read_text(encoding='utf-8')
          assert 'Suporte e Feedback' in (root/'app.js').read_text(encoding='utf-8')
          assert '/suporte.html' in (root/'index.html').read_text(encoding='utf-8')
          assert b'gameDownloadUrl' in (root/'config.js').read_bytes()
          assert b'support_tickets' in (root/'suporte.html').read_bytes()
          with zipfile.ZipFile('site-support/dist/FutBR_Manager_SITE_Com_Suporte_Termos_Privacidade.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist())==needed
          print('PASS: ZIP de producao integro e todos os arquivos na raiz')
          PY
      - name: Publish single-level ZIP for direct Cloudflare Pages upload
        uses: actions/upload-artifact@v4
        with:
          name: FutBR_SITE_ENVIE_DIRETO_NO_CLOUDFLARE
          path: site-support/dist/deploy/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
