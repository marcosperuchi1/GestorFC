name: Diagnose original human match guard while unemployed
on:
  push:
    branches: [fix/desktop-18368-unemployed-real-worker]
    paths: ['.github/workflows/diag-human-match-18368.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import zipfile,io,pathlib,re
          p=sorted(pathlib.Path('.').glob('FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*'))
          with zipfile.ZipFile(io.BytesIO(b''.join(x.read_bytes() for x in p))) as z:
           s=z.read(next(n for n in z.namelist() if n.endswith('/src/index.html'))).decode('utf-8-sig')
          for t in ('function automated(', 'const automated=', 'automated =', 'if(own&&!automated(s,human(s))', 'function upcoming(s)', 'if(s.userEmployed===false)', 'userEmployed=false', 's.userEmployed=false'):
           pos=[m.start() for m in re.finditer(re.escape(t),s)]
           print('\nTERM',t,'COUNT',len(pos),flush=True)
           for i in pos[:3]:print(s[max(0,i-300):i+1250],flush=True)
          PY
