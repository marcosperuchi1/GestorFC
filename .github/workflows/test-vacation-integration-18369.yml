name: FutBR 18.369 real vacation integration on prepared source
on:
  push:
    branches: [fix/desktop-18369-vacation-resume]
    paths: ['.github/workflows/test-vacation-integration-18369.yml', '.github/scripts/*18369.py', '.github/scripts/test_root_gameplay.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: futbr-vacation-integration-18369
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve the exact source prepared before the 18.369 patch
        uses: actions/download-artifact@v4
        with:
          name: FutBR-Source-Diagnostics-18.369-44819044614
          run-id: 44819044614
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/futbr-prepared-regression-18369
      - name: Verify prepared baseline and apply current patch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'futbr-prepared-regression-18369'
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8-sig'))
          assert manifest['commit']=='40a289c407c720a69a9243d5f552a14a21b49289'
          digest=hashlib.sha256((root/'prepared/src/index.html').read_bytes()).hexdigest()
          assert digest==manifest['htmlSha256']=='39f347a69bee561ea6957b888294c7c2dc520ade1ee088746fd933eba19e55bd'
          print('Exact pre-18.369 game source verified:',digest)
          PY
          python .github/scripts/fix_vacation_resume_18369.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
      - name: Verify original queue and handoff contracts
        shell: bash
        run: |
          python .github/scripts/test_vacation_resume_18369.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
          python .github/scripts/test_vacation_queue_18369.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
          python .github/scripts/test_vacation_lifecycle_scope_18369.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
          python .github/scripts/test_root_gameplay.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
      - name: Install browser test driver
        run: python -m pip install playwright
      - name: Run actual Engine and Worker scenarios
        shell: bash
        run: |
          python .github/scripts/test_unemployed_real_browser_18368.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
          python .github/scripts/test_vacation_resume_browser_18369.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
          python .github/scripts/test_vacation_dismissal_browser_18369.py "$RUNNER_TEMP/futbr-prepared-regression-18369/prepared"
      - name: Retain real integration reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: FutBR-Real-Vacation-Integration-18.369-${{ github.run_id }}
          path: ${{ runner.temp }}/futbr-prepared-regression-18369/prepared/*-tests.json
          if-no-files-found: warn
          retention-days: 7
