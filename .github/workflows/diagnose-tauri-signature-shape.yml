name: Diagnosticar formato Minisign Tauri 18.341
on:
  push:
    branches: [feature/desktop-18341-updater-signature-repair]
    paths: ['.github/workflows/diagnose-tauri-signature-shape.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspecionar apenas estrutura publica da assinatura Tauri
        run: |
          python3 - <<'PY'
          import urllib.request,base64,json
          url='https://download.futbrmanager.com.br/updates/FutBR-Manager-18.340-Windows.exe.sig'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'FutBR-key-diagnostic/1.0'}),timeout=30) as r:raw=r.read()
          print('FILE_LENGTH',len(raw))
          for d in range(5):
              try:
                  text=raw.decode('utf-8')
              except UnicodeDecodeError:
                  print('DECODE',d,'non_utf8',len(raw))
                  break
              lines=[s.strip() for s in text.splitlines() if s.strip()]
              kinds=['comment' if s.startswith(('untrusted comment:','trusted comment:')) else ('minisign_base64line' if s.startswith(('RU','RW')) else ('other' if any(not(c.isascii() and (c.isalnum() or c in '/+=')) for c in s) else 'base64line')) for s in lines]
              print('DECODE',d,'length',len(raw),'line_lengths',[len(s) for s in lines],'kinds',kinds)
              try:next_bytes=base64.b64decode(text.strip(),validate=True)
              except Exception as e:
                  print('DECODE',d,'cannot_decode_base64',type(e).__name__)
                  break
              raw=next_bytes
          PY
