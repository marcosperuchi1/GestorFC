name: Preflight 18.360 vacation memory and checkpoint finalize
on:
  push:
    branches: [perf/desktop-18360-vacation-finalize-lightweight]
    paths:
      - '.github/workflows/preflight-vacation-18360.yml'
      - '.github/scripts/optimize_vacation_finalize_18360.py'
      - '.github/scripts/test_vacation_finalize_18360.py'
      - '.github/scripts/test_vacation_preflight_18360.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression of actual game source, manifest and performance bounds
        run: |
          python -m py_compile .github/scripts/optimize_vacation_finalize_18360.py .github/scripts/test_vacation_finalize_18360.py .github/scripts/test_vacation_preflight_18360.py
          python .github/scripts/test_vacation_preflight_18360.py
