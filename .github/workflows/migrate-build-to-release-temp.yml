name: Disparar build desktop temporariamente

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-build-to-release-temp.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar workflow principal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-desktop-rc1-clean.yml --ref main
