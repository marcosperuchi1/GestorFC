name: Build FutBR Android Alpha (WebView APK fallback)
on:
  workflow_dispatch:
  push:
    branches: [mobile/android-alpha]
    paths: ['.github/workflows/build-android-webview-alpha.yml']
permissions:
  contents: read
concurrency:
  group: futbr-android-webview-alpha
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Preparar navegador e reconstruir jogo
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
          python .github/scripts/inspect_season_performance.py
      - name: Aplicar atualizacoes ate 18.331 e adaptar web ao Android
        run: |
          set -euo pipefail
          for script in optimize_season_sync_18310 fix_new_season_vacation_18311 optimize_rankings_finals_18312 optimize_career_runtime_18313 fix_rank_details_18314 fix_rank_titles_sparse_18315 fix_rank_rollover_18316 fix_rank_titles_18317 rebuild_rankings_18318 clean_rankings_18320 fix_rankings_ui_18321 feature_champions_retirement_18322 optimize_unemployed_turbo_18327 fix_device_sessions_18329 optimize_scout_18331; do
            python ".github/scripts/$script.py" "$FUTBR_INSPECT_PROJECT"
          done
          python .github/scripts/prepare_android_alpha.py prepare "$FUTBR_INSPECT_PROJECT"
      - name: Criar contenedor Android WebView
        run: |
          set -euo pipefail
          cd "$FUTBR_INSPECT_PROJECT"
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.futbrmanager.android",
            "appName": "FutBR Manager",
            "webDir": "src",
            "server": {"androidScheme": "https"}
          }
          JSON
          npx cap add android
          npx cap sync android
          python - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text(encoding='utf-8')
          if 'android:screenOrientation=' not in text:
              text=text.replace('<activity','<activity android:screenOrientation="sensorLandscape"',1)
          if 'android.permission.INTERNET' not in text:
              text=text.replace('<application','<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Compilar APK debug instalado por arquivo
        run: |
          set -euo pipefail
          cd "$FUTBR_INSPECT_PROJECT/android"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Validar APK e publicar artefato
        run: |
          set -euo pipefail
          mkdir -p android-output
          src="$FUTBR_INSPECT_PROJECT/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src"
          cp "$src" android-output/FutBR-Manager-Android-Alpha-WebView.apk
          cp "$FUTBR_INSPECT_PROJECT/android-alpha-report.json" android-output/
          sha256sum android-output/*.apk > android-output/SHA256SUMS.txt
          ls -lh android-output
          test -s android-output/FutBR-Manager-Android-Alpha-WebView.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FutBR-Manager-Android-Alpha-WebView-APK
          path: android-output/*
          if-no-files-found: error
          retention-days: 7
