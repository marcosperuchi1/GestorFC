name: Limpar artifacts restantes do Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-artifacts-final-temp.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Excluir todos os artifacts restantes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' > /tmp/artifact_ids.txt
          count=0
          while read -r id; do
            [ -z "${id:-}" ] && continue
            echo "Excluindo artifact $id"
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            count=$((count+1))
          done < /tmp/artifact_ids.txt
          echo "Artifacts excluidos: $count"
          remaining=$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=1" --jq '.total_count')
          echo "Artifacts restantes: $remaining"
          test "$remaining" -eq 0
