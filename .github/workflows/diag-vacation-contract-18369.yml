name: Diagnose actual vacation setup and step contract 18.369
on:
  push:
    branches: [fix/desktop-18369-vacation-resume]
    paths: [.github/workflows/diag-vacation-contract-18369.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import pathlib,zipfile,io,re
          parts=sorted(pathlib.Path('.').glob('FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*'))
          with zipfile.ZipFile(io.BytesIO(b''.join(x.read_bytes() for x in parts))) as z:
            s=z.read(next(n for n in z.namelist() if n.endswith('/src/index.html'))).decode('utf-8-sig')
          for name,t,k in [
             ('VAC_STEP','async function vacationStepAsync(',3100),
             ('VAC_STEP2','vacationStepAsync(s)',2700),
             ('VAC_START','function startVacation(',2700),
             ('VAC_START2','function v624StartVacation(',2700),
             ('VAC_RUN','runVacation=async function()',1300),
             ('VAC_FIELDS','vacation:{',1400),
             ('VAC_REQUEST',"a==='vac-start'",2300),
             ('VAC_END',"a==='vac-end'&&v53Sim",2000),
             ('VAC_STOP',"function v627Vacation",1200),
          ]:
           i=s.find(t)
           print('\n===',name,'count',s.count(t),'pos',i,'===',flush=True)
           if i>=0:print(s[i:i+k],flush=True)
          PY
