name: Diagnose 18.355 unemployed offers and save-exit
on:
  push:
    branches: [fix/desktop-18355-offers-saveexit]
    paths: ['.github/workflows/diagnose-offers-save-18355.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source - no save or game data modified
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,zipfile,io,re
          parts=sorted(pathlib.Path('.').glob('FutBR_Manager_Desktop_RC1_TAURI_SOURCE.zip.part*'))
          archive=b''.join(p.read_bytes() for p in parts)
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            names=z.namelist()
            print("HTML_CANDIDATES",[(n,z.getinfo(n).file_size) for n in names if n.endswith('/src/index.html')][:10])
            fname=next(n for n in names if n.endswith('/src/index.html'))
            src=z.read(fname).decode('utf-8-sig')
          print("SOURCE_LENGTH",len(src))
          needles=[
            ('JOB_WAIT','async function v89RunJobWait(){',7200),
            ('COACH_ROUND','function v636AfterRound(',8000),
            ('COACH_OFFERS','v636AfterRound(state,before)',3500),
            ('SAVE_INDEX','async function doSave(',6500),
            ('SAVE_EXIT','exitAfter=false',4500),
            ('FLUSH','async function v52FlushSave(',4500),
            ('SAVE','async function persist(',5200),
            ('EXIT','closeGame()',3500),
            ('END_OF_SEASON','userEmployed=false',1800),
          ]
          for label,term,length in needles:
            i=src.find(term)
            print("\n===",label,"POS",i,"===",flush=True)
            if i>=0:print(src[max(0,i-240):i+length],flush=True)
          for label,pattern,span in [
            ('OFFER_DEFINITION','function v636GenerateCoachOffer(',11000),
            ('OFFER_CLEAN','function v636CleanCoachOffers(',3500),
            ('OFFER_PENDING','function v636PendingCoachOffers(',3000),
            ('UNEMPLOYED','function v636CoachState(',4500),
            ('SIM_WORKER','async function v53StartSimulation(',4800),
            ('SAVED_OVERRIDE','FUTBR_LONG_CAREER_SAVE_18338_BEGIN',5000),
            ('NAMED_SAVE','async function doSave(asCopy=false,exitAfter=false)',3600),
            ('SAVE_ENGINE','async function saveSharded(s,mode=',2300),
          ]:
            i=src.find(pattern)
            print("\\nTARGET",label,i,flush=True)
            if i>=0:print(src[i:i+span],flush=True)
          for label,pattern,span in [
            ('JOB_AVAILABLE','availableJobs(s)',1800),
            ('AVAILABLE_DEF','availableJobs(',4200),
            ('COACH_STATE','function v636CoachState(',3200),
            ('COACH_UNEMPLOYED','unemployedSince',3500),
            ('JOB_TAKE','takeJob(s,',3300),
            ('PERSIST_DEF','persist=function(',2800),
            ('SAVING_OVERRIDE','v52FlushSave=async',1800),
            ('ACTUAL_SAVE','const basePersist=persist;',3100),
          ]:
            i=src.find(pattern)
            print("\\nDETAIL",label,i,flush=True)
            if i>=0:print(src[max(0,i-350):i+span],flush=True)
          fun=re.findall(r'\b(?:async )?function (v636\w+|v89\w+|v52\w+|v53\w+)\s*\(',src)
          print("FUNCTIONS",fun[:100])
          PY